# Sobe a plataforma inteira com: docker compose up --build
#
# Sao sete processos. Os servicos conversam pela rede interna do Compose.
# Em desenvolvimento o navegador fala com o gateway (so na propria maquina, porta 8080).
# Em producao:  docker compose --profile producao up -d --build
# sobe tambem o Caddy (servico web), unica porta publica: 80 e 443, com HTTPS automatico.

# Teto de memoria por container: a JVM usa 75% dele (MaxRAMPercentage no Dockerfile), e
# um servico que estoura cai sozinho em vez de levar o host junto. O finance tem mais
# por causa do Tesseract (memoria nativa, fora da heap). Ajuste com PIGGU_MEMORIA_<SERVICO>.

# Imagens: em desenvolvimento cada servico e compilado aqui (localhost/piggu/<servico>:dev,
# nome que nao existe em registro nenhum). Em producao o CI ja compilou, testou e publicou
# no GitHub (job "imagens" do .github/workflows/ci.yml) e o deploy/atualizar.sh so baixa:
#   PIGGU_IMAGENS=ghcr.io/piggubr/cofrinho-app  PIGGU_VERSAO=<sha do commit>

# Logs no stdout de cada container, com rotacao (S5): no maximo 5 arquivos de 10 MB
# por servico. O mais velho sai sozinho, entao log com id de usuario nao fica para
# sempre. Prazo e destino estao em docs/implantacao-producao.md (Logs).
# "labels" grava o nome do servico em cada linha: e por ele que o Alloy (perfil
# observabilidade) separa os logs no Grafana sem precisar do socket do Docker.
x-logs: &logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
    labels: com.docker.compose.service

# Os containers do monitoramento nao mandam os proprios logs para o Loki (sem "labels").
x-logs-monitoramento: &logs-monitoramento
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    logging: *logs
    mem_limit: ${PIGGU_MEMORIA_POSTGRES:-512m}
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: piggu
      POSTGRES_PASSWORD: ${DB_PASSWORD:-piggu}
      POSTGRES_DB: postgres
      # Um usuario por servico (db/init/01-criar-bancos.sh). Sem a variavel propria,
      # vale DB_PASSWORD, o que so serve em desenvolvimento.
      DB_PASSWORD_IDENTITY: ${DB_PASSWORD_IDENTITY:-${DB_PASSWORD:-piggu}}
      DB_PASSWORD_FINANCE: ${DB_PASSWORD_FINANCE:-${DB_PASSWORD:-piggu}}
      DB_PASSWORD_REWARDS: ${DB_PASSWORD_REWARDS:-${DB_PASSWORD:-piggu}}
      DB_PASSWORD_LIFESTYLE: ${DB_PASSWORD_LIFESTYLE:-${DB_PASSWORD:-piggu}}
      DB_PASSWORD_MEDIA: ${DB_PASSWORD_MEDIA:-${DB_PASSWORD:-piggu}}
      DB_PASSWORD_BANKING: ${DB_PASSWORD_BANKING:-${DB_PASSWORD:-piggu}}
      # Usuario do painel analitico (Grafana): so le contagens do schema "analitico".
      DB_PASSWORD_ANALITICO: ${DB_PASSWORD_ANALITICO:-${DB_PASSWORD:-piggu}}
    volumes:
      - piggu-dados:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      # So na propria maquina: a senha padrao e conhecida e o banco nao pode ficar na rede.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U piggu -d postgres"]   # sem -d o Postgres loga FATAL a cada 5 s
      interval: 5s
      timeout: 5s
      retries: 10

  identity:
    logging: *logs
    mem_limit: ${PIGGU_MEMORIA_IDENTITY:-512m}
    image: ${PIGGU_IMAGENS:-localhost/piggu}/identity:${PIGGU_VERSAO:-dev}
    build:
      context: .
      args:
        MODULO: piggu-identity
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/piggu_identity
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ${PIGGU_LOG_FORMATO:-ecs}
      DB_USER: piggu_identity
      DB_PASSWORD: ${DB_PASSWORD_IDENTITY:-${DB_PASSWORD:-piggu}}
      PIGGU_AMBIENTE: ${PIGGU_AMBIENTE:-dev}
      PIGGU_LIMITE_PROXIESNAFRENTE: ${PIGGU_LIMITE_PROXIESNAFRENTE:-1}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?defina GOOGLE_CLIENT_ID no arquivo .env}
      GOOGLE_CLIENT_ID_ANDROID: ${GOOGLE_CLIENT_ID_ANDROID:-}
      # Entrar com Apple no app nativo: Bundle ID (br.com.piggu.app). Vazio deixa a rota em 501.
      APPLE_CLIENT_IDS: ${APPLE_CLIENT_IDS:-}
      JWT_ISSUER: ${JWT_ISSUER:-https://piggu.app}
      PIGGU_ADMIN_EMAILS: ${PIGGU_ADMIN_EMAILS:-}
      # Cifra do CPF (32 bytes base64). Vazia so em desenvolvimento; em producao o identity recusa subir.
      PIGGU_CPF_CHAVE: ${PIGGU_CPF_CHAVE:-}
      # Sem chave o identity recusa subir. O padrao aponta para o par gerado por
      # scripts/gerar-chaves-dev.sh; em producao defina as duas no .env.
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-file:/app/keys/piggu-dev-private.pem}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-file:/app/keys/piggu-dev-public.pem}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_MENSAL: ${STRIPE_PRICE_MENSAL:-}
      STRIPE_PRICE_ANUAL: ${STRIPE_PRICE_ANUAL:-}
      STRIPE_PRICE_FAMILIA_MENSAL: ${STRIPE_PRICE_FAMILIA_MENSAL:-}
      STRIPE_PRICE_FAMILIA_ANUAL: ${STRIPE_PRICE_FAMILIA_ANUAL:-}
      STRIPE_PRICE_CASAL_MENSAL: ${STRIPE_PRICE_CASAL_MENSAL:-}
      STRIPE_PRICE_CASAL_ANUAL: ${STRIPE_PRICE_CASAL_ANUAL:-}
      PIGGU_DIAS_DE_TESTE: ${PIGGU_DIAS_DE_TESTE:-14}
      # Open Finance escondido por enquanto (some da lista do Premium). true volta.
      PIGGU_OPEN_FINANCE: ${PIGGU_OPEN_FINANCE:-false}
      REVENUECAT_WEBHOOK_SECRET: ${REVENUECAT_WEBHOOK_SECRET:-}
      SITE_URL: ${SITE_URL:-http://localhost:4200}
      # Avisos fora do app (fatura, orcamento, conta fixa): cada canal liga com as credenciais.
      PIGGU_EMAIL_API_KEY: ${PIGGU_EMAIL_API_KEY:-}
      PIGGU_EMAIL_REMETENTE: ${PIGGU_EMAIL_REMETENTE:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_CHAVE: ${APNS_CHAVE:-}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-}
      APNS_SANDBOX: ${APNS_SANDBOX:-false}
      FCM_CONTA_DE_SERVICO: ${FCM_CONTA_DE_SERVICO:-}
      # Exportar e apagar a conta passa por todos os servicos com dado de pessoas.
      FINANCE_URL: http://finance:8082
      REWARDS_URL: http://rewards:8083
      LIFESTYLE_URL: http://lifestyle:8084
      MEDIA_URL: http://media:8085
      # Com o Open Finance ligado:  BANKING_URL=http://banking:8086  no .env
      BANKING_URL: ${BANKING_URL:-}
    volumes:
      - ./keys:/app/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  finance:
    logging: *logs
    mem_limit: ${PIGGU_MEMORIA_FINANCE:-1g}
    image: ${PIGGU_IMAGENS:-localhost/piggu}/finance:${PIGGU_VERSAO:-dev}
    build:
      context: .
      args:
        MODULO: piggu-finance
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/piggu_finance
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ${PIGGU_LOG_FORMATO:-ecs}
      DB_USER: piggu_finance
      DB_PASSWORD: ${DB_PASSWORD_FINANCE:-${DB_PASSWORD:-piggu}}
      PIGGU_AMBIENTE: ${PIGGU_AMBIENTE:-dev}
      PIGGU_LIMITE_PROXIESNAFRENTE: ${PIGGU_LIMITE_PROXIESNAFRENTE:-1}
      JWKS_URI: http://identity:8081/.well-known/jwks.json
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PIGGU_ASSISTENTE_PERGUNTAS_POR_MES: ${PIGGU_ASSISTENTE_PERGUNTAS_POR_MES:-150}
      # false (padrao): recibo lido so pelo Gemini. true volta o leitor proprio (Tesseract) primeiro.
      PIGGU_LEITOR_PROPRIO: ${PIGGU_LEITOR_PROPRIO:-false}
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_healthy

  rewards:
    logging: *logs
    mem_limit: ${PIGGU_MEMORIA_REWARDS:-384m}
    image: ${PIGGU_IMAGENS:-localhost/piggu}/rewards:${PIGGU_VERSAO:-dev}
    build:
      context: .
      args:
        MODULO: piggu-rewards
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/piggu_rewards
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ${PIGGU_LOG_FORMATO:-ecs}
      DB_USER: piggu_rewards
      DB_PASSWORD: ${DB_PASSWORD_REWARDS:-${DB_PASSWORD:-piggu}}
      PIGGU_AMBIENTE: ${PIGGU_AMBIENTE:-dev}
      PIGGU_LIMITE_PROXIESNAFRENTE: ${PIGGU_LIMITE_PROXIESNAFRENTE:-1}
      JWKS_URI: http://identity:8081/.well-known/jwks.json
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_healthy

  lifestyle:
    logging: *logs
    mem_limit: ${PIGGU_MEMORIA_LIFESTYLE:-384m}
    image: ${PIGGU_IMAGENS:-localhost/piggu}/lifestyle:${PIGGU_VERSAO:-dev}
    build:
      context: .
      args:
        MODULO: piggu-lifestyle
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/piggu_lifestyle
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ${PIGGU_LOG_FORMATO:-ecs}
      DB_USER: piggu_lifestyle
      DB_PASSWORD: ${DB_PASSWORD_LIFESTYLE:-${DB_PASSWORD:-piggu}}
      PIGGU_AMBIENTE: ${PIGGU_AMBIENTE:-dev}
      PIGGU_LIMITE_PROXIESNAFRENTE: ${PIGGU_LIMITE_PROXIESNAFRENTE:-1}
      JWKS_URI: http://identity:8081/.well-known/jwks.json
      MEDIA_URL: http://media:8085
      TMDB_READ_TOKEN: ${TMDB_READ_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_healthy

  media:
    logging: *logs
    mem_limit: ${PIGGU_MEMORIA_MEDIA:-512m}
    image: ${PIGGU_IMAGENS:-localhost/piggu}/media:${PIGGU_VERSAO:-dev}
    build:
      context: .
      args:
        MODULO: piggu-media
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/piggu_media
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ${PIGGU_LOG_FORMATO:-ecs}
      DB_USER: piggu_media
      DB_PASSWORD: ${DB_PASSWORD_MEDIA:-${DB_PASSWORD:-piggu}}
      PIGGU_AMBIENTE: ${PIGGU_AMBIENTE:-dev}
      PIGGU_LIMITE_PROXIESNAFRENTE: ${PIGGU_LIMITE_PROXIESNAFRENTE:-1}
      JWKS_URI: http://identity:8081/.well-known/jwks.json
      DRIVE_CREDENTIALS: ${DRIVE_CREDENTIALS:-}
      DRIVE_ROOT_FOLDER_ID: ${DRIVE_ROOT_FOLDER_ID:-}
      STORAGE_LOCAL_PATH: /dados/fotos
    volumes:
      - piggu-fotos:/dados/fotos
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_healthy

  # Opcional: so sobe com  docker compose --profile open-finance up
  # Sem ele o gateway continua no ar e o painel apenas esconde o card de bancos.
  banking:
    logging: *logs
    mem_limit: ${PIGGU_MEMORIA_BANKING:-384m}
    profiles: ["open-finance"]
    image: ${PIGGU_IMAGENS:-localhost/piggu}/banking:${PIGGU_VERSAO:-dev}
    build:
      context: .
      args:
        MODULO: piggu-banking
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/piggu_banking
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ${PIGGU_LOG_FORMATO:-ecs}
      DB_USER: piggu_banking
      DB_PASSWORD: ${DB_PASSWORD_BANKING:-${DB_PASSWORD:-piggu}}
      PIGGU_AMBIENTE: ${PIGGU_AMBIENTE:-dev}
      PIGGU_LIMITE_PROXIESNAFRENTE: ${PIGGU_LIMITE_PROXIESNAFRENTE:-1}
      JWKS_URI: http://identity:8081/.well-known/jwks.json
      PLUGGY_CLIENT_ID: ${PLUGGY_CLIENT_ID:-}
      PLUGGY_CLIENT_SECRET: ${PLUGGY_CLIENT_SECRET:-}
      PLUGGY_SANDBOX: ${PLUGGY_SANDBOX:-false}
      # false (padrao): card de bancos escondido e novas conexoes recusadas. true volta.
      PIGGU_OPEN_FINANCE: ${PIGGU_OPEN_FINANCE:-false}
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_healthy

  gateway:
    logging: *logs
    mem_limit: ${PIGGU_MEMORIA_GATEWAY:-384m}
    image: ${PIGGU_IMAGENS:-localhost/piggu}/gateway:${PIGGU_VERSAO:-dev}
    build:
      context: .
      args:
        MODULO: piggu-gateway
    environment:
      PIGGU_AMBIENTE: ${PIGGU_AMBIENTE:-dev}
      # Log em JSON (ECS), que o Loki separa em campos. PIGGU_LOG_FORMATO= (vazio) volta ao texto.
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ${PIGGU_LOG_FORMATO:-ecs}
      # Chamadas por minuto, por IP, na API inteira. 0 desliga.
      PIGGU_LIMITE_GATEWAY: ${PIGGU_LIMITE_GATEWAY:-600}
      IDENTITY_URL: http://identity:8081
      FINANCE_URL: http://finance:8082
      REWARDS_URL: http://rewards:8083
      LIFESTYLE_URL: http://lifestyle:8084
      MEDIA_URL: http://media:8085
      BANKING_URL: http://banking:8086
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
    ports:
      # So na propria maquina: de fora, a API chega pelo Caddy (HTTPS).
      - "127.0.0.1:8080:8080"
    depends_on:
      - identity
      - finance
      - rewards
      - lifestyle
      - media

  # Porta publica em producao: front + /api para o gateway, HTTPS e cabecalhos de seguranca.
  # Construa o front antes:  cd frontend && npm ci && npm run build
  web:
    logging: *logs
    mem_limit: ${PIGGU_MEMORIA_WEB:-128m}
    profiles: ["producao"]
    image: ${PIGGU_IMAGENS:-localhost/piggu}/web:${PIGGU_VERSAO:-dev}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    environment:
      DOMINIO: "${DOMINIO:?defina DOMINIO no arquivo .env (ex.: piggu.app)}"
      EMAIL_DO_CERTIFICADO: ${EMAIL_DO_CERTIFICADO:?defina EMAIL_DO_CERTIFICADO no arquivo .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # Certificados do Let's Encrypt: sem volume, cada recriacao pediria outro (e bate no limite).
      - caddy-dados:/data
      - caddy-config:/config
    depends_on:
      - gateway
    restart: unless-stopped

  # ---------------------------------------------------------------------------------
  # Monitoramento (perfil observabilidade), tudo no proprio servidor e sem porta publica.
  # Liga com PIGGU_OBSERVABILIDADE=true no .env (o deploy passa a subir junto) ou a mao:
  #   docker compose --profile producao --profile observabilidade up -d
  # O Grafana so escuta na propria maquina (127.0.0.1:3000): abra por tunel SSH.
  # Guia: docs/observabilidade.md. Ninguem aqui guarda dado pessoal: metricas sao
  # contagens e tempos; logs ficam 30 dias e passam por um filtro de e-mail/CPF/token.
  # ---------------------------------------------------------------------------------
  prometheus:
    logging: *logs-monitoramento
    mem_limit: ${PIGGU_MEMORIA_PROMETHEUS:-384m}
    profiles: ["observabilidade"]
    image: prom/prometheus:v3.13.4
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Um ano de historia (pessoas ativas, tempos), com teto de disco.
      - --storage.tsdb.retention.time=365d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./observabilidade/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-dados:/prometheus
    restart: unless-stopped

  loki:
    logging: *logs-monitoramento
    mem_limit: ${PIGGU_MEMORIA_LOKI:-384m}
    profiles: ["observabilidade"]
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/loki.yml"]
    environment:
      GOMEMLIMIT: ${PIGGU_GOMEMLIMIT_LOKI:-320MiB}   # teto do Go abaixo do mem_limit (veja o grafana)
    volumes:
      - ./observabilidade/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-dados:/loki
    restart: unless-stopped

  # Le os arquivos de log que o Docker grava (somente leitura) e manda para o Loki.
  alloy:
    logging: *logs-monitoramento
    mem_limit: ${PIGGU_MEMORIA_ALLOY:-192m}
    profiles: ["observabilidade"]
    image: grafana/alloy:v1.20.1
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      - /etc/alloy/config.alloy
    environment:
      GOMEMLIMIT: ${PIGGU_GOMEMLIMIT_ALLOY:-160MiB}
    volumes:
      - ./observabilidade/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - alloy-dados:/var/lib/alloy/data
    depends_on:
      - loki
    restart: unless-stopped

  # CPU, memoria e disco da maquina. Le /proc e /sys do servidor, sem escrever nada.
  node-exporter:
    logging: *logs-monitoramento
    mem_limit: ${PIGGU_MEMORIA_NODE_EXPORTER:-64m}
    profiles: ["observabilidade"]
    image: prom/node-exporter:v1.12.1
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/raiz
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/raiz:ro
    restart: unless-stopped

  grafana:
    logging: *logs-monitoramento
    mem_limit: ${PIGGU_MEMORIA_GRAFANA:-384m}
    profiles: ["observabilidade"]
    image: grafana/grafana-oss:13.0.2
    # Sem GRAFANA_SENHA o Grafana nao sobe (e o resto do Piggu segue normal): sem isso ele
    # abriria com admin/admin.
    entrypoint: ["sh", "-c", "[ -n \"$$GF_SECURITY_ADMIN_PASSWORD\" ] || { echo 'Defina GRAFANA_SENHA no .env'; exit 1; }; exec /run.sh"]
    environment:
      # Go sem teto passa do mem_limit em picos (abrir varios paineis) e o kernel mata o
      # processo. Com o teto, o coletor de lixo aperta antes. Mudou PIGGU_MEMORIA_GRAFANA? Mude junto.
      GOMEMLIMIT: ${PIGGU_GOMEMLIMIT_GRAFANA:-300MiB}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USUARIO:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_SENHA:-}
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_DEFAULT_LANGUAGE: pt-BR
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      # Alertas por e-mail pela Resend (SMTP), com a mesma chave dos avisos do app.
      GF_SMTP_ENABLED: ${GRAFANA_SMTP_LIGADO:-true}
      GF_SMTP_HOST: ${GRAFANA_SMTP_HOST:-smtp.resend.com:465}
      GF_SMTP_USER: ${GRAFANA_SMTP_USUARIO:-resend}
      GF_SMTP_PASSWORD: ${GRAFANA_SMTP_SENHA:-${PIGGU_EMAIL_API_KEY:-}}
      GF_SMTP_FROM_ADDRESS: ${PIGGU_ALERTAS_REMETENTE:-alertas@piggu.invalid}
      GF_SMTP_FROM_NAME: Piggu alertas
      PIGGU_ALERTAS_EMAIL: ${PIGGU_ALERTAS_EMAIL:-ninguem@piggu.invalid}
      DB_PASSWORD_ANALITICO: ${DB_PASSWORD_ANALITICO:-${DB_PASSWORD:-piggu}}
    ports:
      # So na propria maquina. De casa: ssh -L 3000:localhost:3000 (guia).
      - "127.0.0.1:3000:3000"
    volumes:
      - ./observabilidade/grafana/provisionamento/fontes:/etc/grafana/provisioning/datasources:ro
      - ./observabilidade/grafana/provisionamento/paineis:/etc/grafana/provisioning/dashboards:ro
      - ./observabilidade/grafana/provisionamento/alertas:/etc/grafana/provisioning/alerting:ro
      - ./observabilidade/grafana/paineis:/var/lib/grafana/paineis-do-piggu:ro
      - grafana-dados:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

volumes:
  piggu-dados:
  piggu-fotos:
  caddy-dados:
  caddy-config:
  prometheus-dados:
  loki-dados:
  alloy-dados:
  grafana-dados:
