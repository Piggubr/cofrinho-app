# Loki do Piggu: guarda os logs dos servicos por 30 dias (docs/implantacao-producao.md, Logs)
# e apaga sozinho o que passou disso. Um processo so, disco local, sem nada publico.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # LGPD: log com id de conta nao fica mais que 30 dias.
  retention_period: 720h
  allow_structured_metadata: true
  # Sem o rotulo automatico service_name: o nosso e "servico".
  discover_service_name: []
  # Teto de entrada: um servico em loop de erro nao enche o disco do servidor.
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 8

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
