# Perfil de teste: banco vem do Testcontainers; a Pluggy e sempre um mock.
spring:
  jpa:
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:0/.well-known/jwks.json

piggu:
  # Os testes fazem muitas escritas seguidas com a mesma conta; o limite em si tem
  # teste proprio (LimiteDeRequisicoesTest).
  limite:
    login: 100000
    publico: 100000
    escrita: 100000
    envio: 100000
  pluggy:
    base-url: http://localhost:0
    client-id: ""
    client-secret: ""

logging:
  level:
    org.hibernate.SQL: WARN
    com.piggu: WARN
