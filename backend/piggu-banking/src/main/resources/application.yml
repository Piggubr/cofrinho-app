server:
  port: ${PORT:8086}

spring:
  application:
    name: piggu-banking
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/piggu_banking}
    username: ${DB_USER:piggu}
    password: ${DB_PASSWORD:piggu}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Chave publica do piggu-identity. Baixada uma vez e mantida em cache.
          jwk-set-uri: ${JWKS_URI:http://localhost:8081/.well-known/jwks.json}
  http:
    clients:
      # Vale para o RestClient da Pluggy: uma instituicao lenta nao segura a thread.
      connect-timeout: 5s
      read-timeout: 30s

piggu:
  # dev (padrao) ou producao. Em producao o servico recusa subir com segredo fraco.
  ambiente: ${PIGGU_AMBIENTE:dev}
  open-finance:
    # false (padrao): card de bancos escondido e novas conexoes recusadas. PIGGU_OPEN_FINANCE=true volta.
    ligado: ${PIGGU_OPEN_FINANCE:false}
  pluggy:
    # So por variavel de ambiente. Vazio desliga as rotas de banco com aviso claro.
    client-id: ${PLUGGY_CLIENT_ID:}
    client-secret: ${PLUGGY_CLIENT_SECRET:}
    # true mostra os bancos de teste da Pluggy no widget. Nunca em producao.
    sandbox: ${PLUGGY_SANDBOX:false}

management:
  endpoints:
    web:
      exposure:
        # prometheus: metricas do painel (backend/observabilidade). So a rede interna do
        # Compose chega aqui: o Caddy repassa apenas /api e o gateway nao roteia /actuator.
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      # Poucas faixas fixas de tempo: o painel tira o p95 de cada rota sem inflar o Prometheus.
      slo:
        http.server.requests: 50ms,100ms,250ms,500ms,1s,2s,5s

logging:
  pattern:
    # Toda linha leva a requisicao (X-Request-Id do gateway) e o id do usuario.
    level: "%5p [req=%X{requestId:-} user=%X{userId:-}]"
  level:
    com.piggu: ${LOG_LEVEL:INFO}

# Contrato da API (docs/api e docs/API_SPEC.md), gerado pelo springdoc. Desligado aqui, o que
# vale para producao; o perfil dev (application-dev.yml) e os testes ligam.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
  # Mesma ordem a cada geracao: o teste de contrato compara o arquivo inteiro.
  writer-with-order-by-keys: true
  # A API responde JSON; sem isto o contrato diria "*/*" em toda resposta.
  default-produces-media-type: application/json
