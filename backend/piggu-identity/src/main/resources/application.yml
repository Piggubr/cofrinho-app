server:
  port: ${PORT:8081}

spring:
  application:
    name: piggu-identity
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/piggu_identity}
    username: ${DB_USER:piggu}
    password: ${DB_PASSWORD:piggu}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

piggu:
  google:
    # IDs OAuth aceitos. O segundo permite manter uma implantacao de testes em
    # paralelo, como faziam GOOGLE_CLIENT_ID e GOOGLE_CLIENT_ID_TEST no Apps Script.
    client-ids:
      - ${GOOGLE_CLIENT_ID:532290439779-olhgd7m1hssj4o30gjs3ngrcs7ga48aa.apps.googleusercontent.com}
  jwt:
    issuer: ${JWT_ISSUER:https://piggu.app}
    # Em producao passe o PEM inteiro pelas variaveis de ambiente.
    private-key: ${JWT_PRIVATE_KEY:classpath:keys/piggu-dev-private.pem}
    public-key: ${JWT_PUBLIC_KEY:classpath:keys/piggu-dev-public.pem}
    access-ttl: PT30M
    refresh-ttl: P30D

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.piggu: ${LOG_LEVEL:INFO}
