server:
  port: ${PORT:8081}

spring:
  application:
    name: piggu-identity
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/piggu_identity}
    username: ${DB_USER:piggu}
    password: ${DB_PASSWORD:piggu}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

piggu:
  # dev (padrao) ou producao. Em producao o servico recusa subir com segredo fraco.
  ambiente: ${PIGGU_AMBIENTE:dev}
  google:
    # IDs OAuth aceitos. O segundo permite manter uma implantacao de testes em
    # paralelo, como faziam GOOGLE_CLIENT_ID e GOOGLE_CLIENT_ID_TEST no Apps Script.
    client-ids:
      - ${GOOGLE_CLIENT_ID:532290439779-olhgd7m1hssj4o30gjs3ngrcs7ga48aa.apps.googleusercontent.com}
  jwt:
    issuer: ${JWT_ISSUER:https://piggu.app}
    # Sem valor padrao de proposito: sem JWT_PRIVATE_KEY e JWT_PUBLIC_KEY o servico
    # recusa subir. Aceita o PEM inteiro ou um caminho file:. So o perfil dev
    # (application-dev.yml) aponta para chaves locais geradas por scripts/gerar-chaves-dev.sh.
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
    access-ttl: PT30M
    refresh-ttl: P30D

  # Quem opera a instalacao: ao entrar, essas contas viram ADMIN. Lista separada por
  # virgula, so por variavel de ambiente; nenhum e-mail fica no repositorio.
  admin-emails: ${PIGGU_ADMIN_EMAILS:}

  dados:
    # Servicos que guardam dado de pessoas: exportar e apagar a conta passa por todos.
    # Servico novo com dado pessoal entra aqui, senao a exclusao fica incompleta.
    servicos:
      finance: ${FINANCE_URL:http://localhost:8082}
      rewards: ${REWARDS_URL:http://localhost:8083}
      lifestyle: ${LIFESTYLE_URL:http://localhost:8084}
      media: ${MEDIA_URL:http://localhost:8085}
      # Vazio quando o Open Finance esta desligado.
      banking: ${BANKING_URL:}

  assinatura:
    # Teste gratis do Premium ao assinar pelo site, uma vez por conta. 0 desliga.
    dias-de-teste: ${PIGGU_DIAS_DE_TESTE:7}

  revenuecat:
    # Segredo combinado no painel do RevenueCat (cabecalho Authorization do webhook).
    # Vazio deixa a compra pelos apps em 501.
    webhook-secret: ${REVENUECAT_WEBHOOK_SECRET:}

  stripe:
    # So por variavel de ambiente. Vazio deixa a assinatura pelo site indisponivel.
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    price-mensal: ${STRIPE_PRICE_MENSAL:}
    price-anual: ${STRIPE_PRICE_ANUAL:}
    site-url: ${SITE_URL:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    # Toda linha leva a requisicao (X-Request-Id do gateway) e o id do usuario.
    level: "%5p [req=%X{requestId:-} user=%X{userId:-}]"
  level:
    com.piggu: ${LOG_LEVEL:INFO}
