# Perfil de teste: banco vem do Testcontainers, integracoes externas desligadas.
spring:
  # Cada combinacao de @MockitoBean sobe um contexto com o proprio pool, todos no mesmo
  # Postgres (max_connections 100). Com o padrao de 10 conexoes, o 11o contexto ja nao conecta.
  datasource:
    hikari:
      maximum-pool-size: 4
  jpa:
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:0/.well-known/jwks.json

logging:
  level:
    org.hibernate.SQL: WARN
    com.piggu: WARN

piggu:
  # Os testes fazem muitas escritas seguidas com a mesma conta; o limite em si tem
  # teste proprio (LimiteDeRequisicoesTest).
  limite:
    login: 100000
    publico: 100000
    escrita: 100000
    envio: 100000
  admin-emails: operador@exemplo.test, Outra.Operadora@Exemplo.test
  google:
    client-ids:
      - client-de-teste.apps.googleusercontent.com
  jwt:
    issuer: https://piggu.test
    private-key: classpath:keys/piggu-test-private.pem
    public-key: classpath:keys/piggu-test-public.pem
    access-ttl: PT5M
    refresh-ttl: P30D
  # Sem servicos de dominio nos testes: a cascata e simulada onde importa.
  dados:
    servicos:
      finance: ""
      rewards: ""
      lifestyle: ""
      media: ""
      banking: ""

# O teste de contrato (ContratoDaApiTest) le /v3/api-docs.yaml.
springdoc:
  api-docs:
    enabled: true
