server:
  port: ${PORT:8083}

spring:
  application:
    name: piggu-rewards
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/piggu_rewards}
    username: ${DB_USER:piggu}
    password: ${DB_PASSWORD:piggu}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Chave publica do piggu-identity. Baixada uma vez e mantida em cache.
          jwk-set-uri: ${JWKS_URI:http://localhost:8081/.well-known/jwks.json}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.piggu: ${LOG_LEVEL:INFO}
