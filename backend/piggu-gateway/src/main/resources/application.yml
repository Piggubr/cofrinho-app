server:
  port: ${PORT:8080}

spring:
  application:
    name: piggu-gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              # Volta do login com Google no app instalado: a pagina do Google faz um POST de
              # formulario para ca, com Origin de accounts.google.com (ou "null"). Sem esta
              # entrada o CORS do gateway recusaria com 403. Vem antes do '/**' porque vale a
              # primeira que casa. Sem credenciais: a rota nao le cookie e devolve so uma pagina.
              '[/api/auth/google/app]':
                allowedOriginPatterns: '*'
                allowedMethods: [POST]
                allowCredentials: false
              # Origens do site. Em producao troque pela lista real de dominios:
              # curinga com credenciais nao e aceito pelos navegadores.
              '[/**]':
                allowedOrigins: ${CORS_ORIGINS:http://localhost:4200}
                allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
                # So o que o front manda de fato. Credenciais ligadas por um motivo so: o
                # cookie HttpOnly do refresh (/api/auth). Origem e lista fixa (CORS_ORIGINS).
                allowedHeaders: [Authorization, Content-Type, X-Request-Id]
                exposedHeaders: [X-Request-Id, Retry-After, Content-Disposition]
                allowCredentials: true
                maxAge: 3600
          # Teto de corpo na porta de entrada; cada servico ainda confere o proprio limite
          # (LimiteDeRequisicoes) e o Caddy limita o corpo mesmo sem Content-Length.
          default-filters:
            - name: RequestSize
              args:
                maxSize: 10MB
          # Sem isto o gateway apaga o X-Forwarded-For e todo cliente chega aos servicos com o IP
          # do gateway: um limite de login e uma trava de senha para todo mundo. O filtro so
          # mantem os IPs que casam aqui, inclusive o do cliente, por isso '.*'. Seguro porque o
          # gateway so escuta na propria maquina e na rede interna; o Caddy reescreve o cabecalho.
          trusted-proxies: '.*'
          # Tempo e resultado de cada chamada por rota (servico), para o painel de performance.
          metrics:
            enabled: true
          # Sem prazo, um servico travado deixava a chamada pendurada por minutos (BUG-006). A
          # conexao na rede interna abre em milissegundos; a resposta tem 20 s, acima dos 15 s
          # que o lifestyle espera pelo TMDB e pelo catalogo. Estouro vira 504 (ServicoForaDoAr).
          httpclient:
            connect-timeout: 2000
            response-timeout: 20s
          routes:
            # Rotas lentas de verdade, com prazo proprio (ms). Vem antes da rota do servico,
            # porque vale a primeira que casa.
            # Assistente e leitura de recibo: Gemini (ate 45 s) e OCR (ate 20 s) numa chamada so.
            # Importacao: o extrato inteiro (ate 1.000 linhas) passa pela categorizacao.
            - id: finance-lento
              uri: ${FINANCE_URL:http://localhost:8082}
              order: -1
              predicates:
                - Path=/api/assistant/**,/api/receipts/parse,/api/expenses/import/**,/api/expenses/import
              metadata:
                response-timeout: 90000

            # Exportar e apagar a conta: o identity chama cada servico em sequencia (ate 30 s cada).
            - id: identity-lento
              uri: ${IDENTITY_URL:http://localhost:8081}
              order: -1
              predicates:
                - Path=/api/me,/api/me/export
              metadata:
                response-timeout: 120000

            - id: identity
              uri: ${IDENTITY_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**,/api/me/**,/api/users/**,/api/family/**,/api/billing/**,/api/app/**,/.well-known/**

            - id: finance
              uri: ${FINANCE_URL:http://localhost:8082}
              predicates:
                - Path=/api/expenses/**,/api/monthly-goals/**,/api/piggy-bank/**,/api/notes/**,/api/products/**,/api/categories/**,/api/receipts/**,/api/exchange-rate/**,/api/incomes/**,/api/reports/**,/api/bills/**,/api/budgets/**,/api/accounts/**,/api/history/**,/api/assistant/**

            - id: rewards
              uri: ${REWARDS_URL:http://localhost:8083}
              predicates:
                - Path=/api/coins/**,/api/prizes/**

            - id: lifestyle
              uri: ${LIFESTYLE_URL:http://localhost:8084}
              predicates:
                - Path=/api/places/**,/api/movies/**,/api/shopping/**,/api/personal-goals/**,/api/girls-math/**

            - id: media
              uri: ${MEDIA_URL:http://localhost:8085}
              predicates:
                - Path=/api/assets/**,/api/feed/**

            # Sincronizar conversa com a Pluggy, que tem ate 30 s para responder.
            - id: banking
              uri: ${BANKING_URL:http://localhost:8086}
              predicates:
                - Path=/api/banking/**
              metadata:
                response-timeout: 40000

management:
  endpoints:
    web:
      exposure:
        # Sem "gateway": esse endpoint lista as rotas internas e aceita POST para
        # criar rotas novas, sem autenticacao, na unica porta publicada.
        # prometheus: metricas do painel. A porta do gateway so escuta na propria maquina e o
        # Caddy repassa apenas /api, entao de fora ninguem alcanca o /actuator.
        include: health,info,prometheus
  metrics:
    distribution:
      # Poucas faixas fixas de tempo: o painel tira o p95 de cada servico sem inflar o Prometheus.
      slo:
        http.server.requests: 50ms,100ms,250ms,500ms,1s,2s,5s
        spring.cloud.gateway.requests: 50ms,100ms,250ms,500ms,1s,2s,5s

logging:
  level:
    com.piggu: ${LOG_LEVEL:INFO}

piggu:
  # Open Finance desligado (padrao): GET /api/banking/status responde aqui, sem chamar o
  # banking (BankingDesligadoGlobalFilter). Mesma variavel do identity e do banking.
  open-finance:
    ligado: ${PIGGU_OPEN_FINANCE:false}
  # dev (padrao) ou producao. Em producao o servico recusa subir com segredo fraco.
  ambiente: ${PIGGU_AMBIENTE:dev}
  limite:
    # Chamadas por minuto, por IP, para a API inteira (LimitePorIpGlobalFilter). 0 desliga.
    gateway-por-minuto: ${PIGGU_LIMITE_GATEWAY:600}
