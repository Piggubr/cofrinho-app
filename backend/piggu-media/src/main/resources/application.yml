server:
  port: ${PORT:8085}

spring:
  application:
    name: piggu-media
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/piggu_media}
    username: ${DB_USER:piggu}
    password: ${DB_PASSWORD:piggu}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Chave publica do piggu-identity. Baixada uma vez e mantida em cache.
          jwk-set-uri: ${JWKS_URI:http://localhost:8081/.well-known/jwks.json}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    # Toda linha leva a requisicao (X-Request-Id do gateway) e o id do usuario.
    level: "%5p [req=%X{requestId:-} user=%X{userId:-}]"
  level:
    com.piggu: ${LOG_LEVEL:INFO}

piggu:
  drive:
    # Vazio faz o servico gravar em pasta local, util para desenvolvimento.
    credentials-location: ${DRIVE_CREDENTIALS:}
    root-folder-id: ${DRIVE_ROOT_FOLDER_ID:}
    application-name: Piggu Media
  storage:
    local-path: ${STORAGE_LOCAL_PATH:./dados-fotos}
