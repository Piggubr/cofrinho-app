# Perfil de teste: banco vem do Testcontainers, integracoes externas desligadas.
spring:
  jpa:
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:0/.well-known/jwks.json

logging:
  level:
    org.hibernate.SQL: WARN
    com.piggu: WARN

piggu:
  # Os testes fazem muitas escritas seguidas com a mesma conta; o limite em si tem
  # teste proprio (LimiteDeRequisicoesTest).
  limite:
    login: 100000
    publico: 100000
    escrita: 100000
    envio: 100000
  drive:
    credentials-location: ""
  storage:
    # Adaptador local em pasta temporaria: os testes nao tocam o Google Drive.
    local-path: ${java.io.tmpdir}/piggu-testes-media
