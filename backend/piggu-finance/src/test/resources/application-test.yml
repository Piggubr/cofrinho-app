# Perfil de teste: banco vem do Testcontainers, integracoes externas ficam desligadas.
spring:
  jpa:
    hibernate:
      # Mantido em validate de proposito: e assim que o teste de migrations
      # percebe divergencia entre o SQL do Flyway e o mapeamento das entidades.
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:0/.well-known/jwks.json

piggu:
  # Os testes fazem muitas escritas seguidas com a mesma conta; o limite em si tem
  # teste proprio (LimiteDeRequisicoesTest).
  limite:
    login: 100000
    publico: 100000
    escrita: 100000
    envio: 100000
  integracoes:
    gemini:
      api-key: ""
    cambio:
      base-url: http://localhost:0/cambio
      padrao: "6.15"

logging:
  level:
    org.hibernate.SQL: WARN
    com.piggu: WARN
