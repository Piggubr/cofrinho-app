openapi: 3.1.0
info:
  description: Contrato da API do Piggu. Regras de uso e de compatibilidade em docs/API_SPEC.md.
  title: piggu-media
  version: "1"
servers:
- description: Producao
  url: https://piggu.com.br
- description: "Local, pelo gateway"
  url: http://localhost:8080
security:
- bearer: []
tags:
- description: Fotos do feed da família.
  name: Feed
- description: "Fotos guardadas (feed, lugares, Girls Math)."
  name: Imagens
paths:
  /api/assets:
    post:
      operationId: assetEnviar
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetUploadRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetResponse"
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Enviar imagem
      tags:
      - Imagens
  /api/assets/{id}:
    delete:
      operationId: assetApagar
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Apagar imagem
      tags:
      - Imagens
  /api/assets/{id}/content:
    get:
      operationId: assetBaixar
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
                format: byte
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Baixar a imagem (bytes)
      tags:
      - Imagens
  /api/feed:
    get:
      operationId: feedListar
      parameters:
      - in: query
        name: mes
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeedPhotoResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Listar fotos do feed
      tags:
      - Feed
    post:
      operationId: feedPublicar
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedPhotoRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedPhotoResponse"
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Publicar foto no feed
      tags:
      - Feed
  /api/feed/{id}:
    delete:
      operationId: feedExcluir
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Excluir foto do feed
      tags:
      - Feed
  /api/feed/{id}/caption:
    patch:
      operationId: feedLegendar
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedPhotoResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Trocar a legenda
      tags:
      - Feed
components:
  schemas:
    ApiError:
      type: object
      properties:
        campos:
          type: array
          items:
            $ref: "#/components/schemas/CampoInvalido"
        codigo:
          type: string
        erro:
          type: string
        momento:
          type: string
          format: date-time
    AssetResponse:
      type: object
      properties:
        contentType:
          type: string
        contexto:
          type: string
        criadoEm:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        tamanho:
          type: integer
          format: int64
    AssetUploadRequest:
      type: object
      properties:
        contexto:
          type: string
          maxLength: 30
          minLength: 0
        imageBase64:
          type: string
          maxLength: 7000000
          minLength: 0
        mimeType:
          type: string
          pattern: "image/[a-z0-9.+-]{1,30}"
      required:
      - imageBase64
    CampoInvalido:
      type: object
      properties:
        campo:
          type: string
        mensagem:
          type: string
    CaptionRequest:
      type: object
      properties:
        legenda:
          type: string
          maxLength: 300
          minLength: 0
    FeedPhotoRequest:
      type: object
      properties:
        imageBase64:
          type: string
          maxLength: 7000000
          minLength: 0
        mesKey:
          type: string
          pattern: "^\\d{4}-\\d{2}$"
        mimeType:
          type: string
          pattern: "image/[a-z0-9.+-]{1,30}"
      required:
      - imageBase64
    FeedPhotoResponse:
      type: object
      properties:
        assetId:
          type: string
          format: uuid
        criadoEm:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        legenda:
          type: string
        mesKey:
          type: string
        usuario:
          type: string
          format: uuid
  securitySchemes:
    bearer:
      bearerFormat: JWT
      description: "Access token do login (POST /api/auth/entrar, /api/auth/google,\
        \ /api/auth/apple ou /api/auth/refresh)."
      scheme: bearer
      type: http
