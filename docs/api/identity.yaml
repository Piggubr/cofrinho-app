openapi: 3.1.0
info:
  description: Contrato da API do Piggu. Regras de uso e de compatibilidade em docs/API_SPEC.md.
  title: piggu-identity
  version: "1"
servers:
- description: Producao
  url: https://piggu.com.br
- description: "Local, pelo gateway"
  url: http://localhost:8080
security:
- bearer: []
tags:
- description: Contas da instalação. Só para ADMIN.
  name: Administração
- description: Canais de aviso (e-mail e push) e aparelhos que recebem push.
  name: Avisos
- description: "Erros que aconteceram no aparelho, para o painel de erros."
  name: Erros do app
- description: "A família de quem está logado: ver, renomear, convidar, remover e\
    \ sair."
  name: Família
- description: "O que mudou na família, de quem a pessoa pode ver."
  name: Histórico
- description: "Entrar, renovar e sair; perfil e preferências de quem está logado."
  name: Login e sessão
- description: "CPF, país, foto, termos, cópia dos dados e exclusão da conta."
  name: Minha conta
- description: "Plano, pagamento no site e compra dentro dos apps."
  name: Premium
paths:
  /api/app/erros:
    post:
      operationId: errosDoAppRegistrar
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErroDoApp"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      security: []
      summary: Registrar um erro que aconteceu no app
      tags:
      - Erros do app
  /api/auth/apple:
    post:
      description: Responde 501 (código EM_BREVE) enquanto o servidor não tiver o
        Bundle ID em APPLE_CLIENT_IDS.
      operationId: authEntrarComApple
      parameters:
      - in: header
        name: User-Agent
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppleLoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      security: []
      summary: Entrar com a Apple (identity token)
      tags:
      - Login e sessão
  /api/auth/cadastro:
    post:
      operationId: authCadastrar
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CadastroRequest"
        required: true
      responses:
        "202":
          description: "Pedido aceito, com ou sem conta nesse e-mail: a pessoa confirma\
            \ o e-mail e depois entra"
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      security: []
      summary: Criar conta com e-mail e senha
      tags:
      - Login e sessão
  /api/auth/confirmar-email:
    post:
      operationId: authConfirmarEmail
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmarEmailRequest"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      security: []
      summary: Confirmar o e-mail pelo link
      tags:
      - Login e sessão
  /api/auth/entrar:
    post:
      operationId: authEntrarComSenha
      parameters:
      - in: header
        name: User-Agent
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SenhaLoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      security: []
      summary: Entrar com e-mail e senha
      tags:
      - Login e sessão
  /api/auth/google:
    post:
      operationId: authEntrar
      parameters:
      - in: header
        name: User-Agent
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleLoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      security: []
      summary: Entrar com o Google (ID token)
      tags:
      - Login e sessão
  /api/auth/google/app:
    post:
      operationId: loginNoAppVoltarDoGoogle
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                error:
                  type: string
                id_token:
                  type: string
                state:
                  type: string
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      security: []
      summary: Volta do Google no navegador do celular (login no app)
      tags:
      - Login e sessão
  /api/auth/google/app/troca:
    post:
      operationId: loginNoAppTrocar
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrocaRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrocaResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      security: []
      summary: Trocar o código do login no app pelo ID token do Google
      tags:
      - Login e sessão
  /api/auth/logout:
    post:
      operationId: authSair
      parameters:
      - in: cookie
        name: piggu_refresh
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      security: []
      summary: Sair e encerrar a sessão do refresh token
      tags:
      - Login e sessão
  /api/auth/me:
    get:
      operationId: authEu
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Perfil de quem está logado
      tags:
      - Login e sessão
  /api/auth/me/alerts:
    put:
      operationId: avisosAvisos
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvisosRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Escolher os canais de aviso
      tags:
      - Avisos
  /api/auth/me/devices:
    post:
      operationId: avisosRegistrar
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AparelhoRequest"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Registrar o aparelho para receber push
      tags:
      - Avisos
  /api/auth/me/devices/{token}:
    delete:
      operationId: avisosRemover
      parameters:
      - in: path
        name: token
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Parar de mandar push para o aparelho
      tags:
      - Avisos
  /api/auth/me/email/reenviar:
    post:
      operationId: authReenviarConfirmacao
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Reenviar o link de confirmação do e-mail
      tags:
      - Login e sessão
  /api/auth/me/modules:
    put:
      operationId: authModulos
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModulosRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Ligar e desligar as telas de estilo de vida
      tags:
      - Login e sessão
  /api/auth/me/preferences:
    put:
      operationId: authPreferencias
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreferencesRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Salvar as moedas de exibição e de conversão
      tags:
      - Login e sessão
  /api/auth/me/senha:
    put:
      operationId: authDefinirSenha
      parameters:
      - in: cookie
        name: piggu_refresh
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DefinirSenhaRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Criar ou trocar a senha
      tags:
      - Login e sessão
  /api/auth/me/sharing:
    put:
      operationId: authCompartilhamento
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompartilhamentoRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Escolher o que o parceiro vê
      tags:
      - Login e sessão
  /api/auth/refresh:
    post:
      operationId: authRenovar
      parameters:
      - in: cookie
        name: piggu_refresh
        required: false
        schema:
          type: string
      - in: header
        name: User-Agent
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      security: []
      summary: Renovar a sessão com o refresh token
      tags:
      - Login e sessão
  /api/auth/senha/esqueci:
    post:
      operationId: authEsqueciSenha
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EsqueciSenhaRequest"
        required: true
      responses:
        "202":
          description: "Pedido aceito, com ou sem conta nesse e-mail"
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      security: []
      summary: Pedir o link para redefinir a senha
      tags:
      - Login e sessão
  /api/auth/senha/redefinir:
    post:
      operationId: authRedefinirSenha
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedefinirSenhaRequest"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      security: []
      summary: Redefinir a senha pelo link do e-mail
      tags:
      - Login e sessão
  /api/billing/app-store/transactions:
    post:
      description: 409 com o código OUTRA_CONTA quando a compra foi feita por outra
        conta do Piggu.
      operationId: billingCompraNaApple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompraNaAppleRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanoResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Confirmar a assinatura comprada no iPhone (transação assinada pela
        Apple)
      tags:
      - Premium
  /api/billing/checkout:
    post:
      operationId: billingCheckout
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Abrir o pagamento do Premium no site
      tags:
      - Premium
  /api/billing/google-play/purchases:
    post:
      description: 409 com o código OUTRA_CONTA quando a compra foi feita por outra
        conta do Piggu.
      operationId: billingCompraNoGoogle
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompraNoGoogleRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanoResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Confirmar a assinatura comprada no Android (token da compra no Google
        Play)
      tags:
      - Premium
  /api/billing/plan:
    get:
      operationId: billingPlano
      parameters:
      - in: query
        name: campanha
        required: false
        schema:
          type: string
          maxLength: 40
          minLength: 0
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanoResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Plano atual e opções de assinatura
      tags:
      - Premium
  /api/billing/portal:
    post:
      operationId: billingPortal
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: "Abrir o portal da assinatura (cartão, recibos, cancelar)"
      tags:
      - Premium
  /api/billing/refund:
    post:
      operationId: billingReembolso
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: boolean
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Desistir em até 7 dias com reembolso
      tags:
      - Premium
  /api/billing/stores/{loja}/purchases:
    post:
      operationId: billingCompraNaLoja
      parameters:
      - in: path
        name: loja
        required: true
        schema:
          type: string
      - in: header
        name: Authorization
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: string
        required: true
      responses:
        "200":
          description: Aviso recebido
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      security: []
      summary: "Aviso de compra nas lojas pelo RevenueCat (servidor para servidor,\
        \ não é para o app)"
      tags:
      - Premium
  /api/billing/webhooks/app-store:
    post:
      operationId: billingWebhookAppStore
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvisoDaAppleRequest"
        required: true
      responses:
        "200":
          description: Aviso recebido
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      security: []
      summary: "Aviso da App Store, Server Notifications V2 (servidor para servidor,\
        \ não é para o app)"
      tags:
      - Premium
  /api/billing/webhooks/google-play:
    post:
      operationId: billingWebhookGooglePlay
      parameters:
      - in: header
        name: Authorization
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvisoDoGoogleRequest"
        required: true
      responses:
        "200":
          description: Aviso recebido
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      security: []
      summary: "Aviso do Google Play em tempo real, pelo push do Pub/Sub (servidor\
        \ para servidor, não é para o app)"
      tags:
      - Premium
  /api/billing/webhooks/stripe:
    post:
      operationId: billingWebhookStripe
      parameters:
      - in: header
        name: Stripe-Signature
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: string
        required: true
      responses:
        "200":
          description: Aviso recebido
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      security: []
      summary: "Aviso da Stripe (servidor para servidor, não é para o app)"
      tags:
      - Premium
  /api/family:
    get:
      operationId: familiaVer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamiliaResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Ver a família
      tags:
      - Família
    put:
      operationId: familiaRenomear
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NomeRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamiliaResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Renomear a família
      tags:
      - Família
  /api/family/history:
    get:
      operationId: historicoRecentes
      parameters:
      - in: query
        name: entidade
        required: false
        schema:
          type: string
      - in: query
        name: limite
