components:
  schemas:
    AparelhoRequest:
      type: object
      properties:
        plataforma:
          type: string
          minLength: 1
          pattern: IOS|ANDROID
        token:
          type: string
          minLength: 1
          pattern: "[0-9A-Za-z:_-]{32,512}"
      required:
      - plataforma
      - token
    ApiError:
      type: object
      properties:
        campos:
          type: array
          items:
            $ref: "#/components/schemas/CampoInvalido"
        codigo:
          type: string
        erro:
          type: string
        momento:
          type: string
          format: date-time
    AppleLoginRequest:
      type: object
      properties:
        codigo:
          type: string
          maxLength: 1000
          minLength: 0
        idToken:
          type: string
          maxLength: 4096
          minLength: 0
        lembrar:
          type: boolean
        nome:
          type: string
          maxLength: 120
          minLength: 0
        nonce:
          type: string
          maxLength: 200
          minLength: 0
        refreshNoCorpo:
          type: boolean
        versaoDosTermos:
          type: string
          maxLength: 20
          minLength: 0
      required:
      - idToken
      - nonce
    AvisoDaAppleRequest:
      type: object
      properties:
        signedPayload:
          type: string
          maxLength: 100000
          minLength: 0
      required:
      - signedPayload
    AvisoDoGoogleRequest:
      type: object
      properties:
        message:
          $ref: "#/components/schemas/MensagemDoPubSub"
        subscription:
          type: string
          maxLength: 500
          minLength: 0
      required:
      - message
    Avisos:
      type: object
      properties:
        email:
          type: boolean
        push:
          type: boolean
    AvisosRequest:
      type: object
      properties:
        email:
          type: boolean
        push:
          type: boolean
      required:
      - email
      - push
    CadastroRequest:
      type: object
      properties:
        documento:
          type: string
          maxLength: 40
          minLength: 0
        email:
          type: string
          format: email
          maxLength: 320
          minLength: 0
        nascimento:
          type: string
          format: date
        nome:
          type: string
          maxLength: 120
          minLength: 0
        pais:
          type: string
          maxLength: 2
          minLength: 0
        senha:
          type: string
          maxLength: 200
          minLength: 0
        telefone:
          type: string
          maxLength: 30
          minLength: 0
        versaoDosTermos:
          type: string
          maxLength: 20
          minLength: 0
      required:
      - email
      - nascimento
      - nome
      - senha
      - telefone
    CampoInvalido:
      type: object
      properties:
        campo:
          type: string
        mensagem:
          type: string
    CheckoutRequest:
      type: object
      properties:
        campanha:
          type: string
          maxLength: 40
          minLength: 0
        periodo:
          type: string
          enum:
          - MENSAL
          - ANUAL
          - FAMILIA_MENSAL
          - FAMILIA_ANUAL
          - CASAL_MENSAL
          - CASAL_ANUAL
      required:
      - periodo
    Compartilhamento:
      type: object
      properties:
        compartilharPorPadrao:
          type: boolean
        mostraTudoAoParceiro:
          type: boolean
    CompartilhamentoRequest:
      type: object
      properties:
        compartilharPorPadrao:
          type: boolean
        mostrarTudoAoParceiro:
          type: boolean
      required:
      - compartilharPorPadrao
      - mostrarTudoAoParceiro
    CompraNaAppleRequest:
      type: object
      properties:
        transacao:
          type: string
          maxLength: 20000
          minLength: 0
      required:
      - transacao
    CompraNoGoogleRequest:
      type: object
      properties:
        produto:
          type: string
          minLength: 1
          pattern: premium_(mensal|anual)
        purchaseToken:
          type: string
          maxLength: 4000
          minLength: 0
      required:
      - produto
      - purchaseToken
    ConfirmarEmailRequest:
      type: object
      properties:
        token:
          type: string
          maxLength: 100
          minLength: 0
      required:
      - token
    Convite:
      type: object
      properties:
        email:
          type: string
        familia:
          type: string
        id:
          type: string
          format: uuid
        venceEm:
          type: string
          format: date-time
    ConviteRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          minLength: 0
      required:
      - email
    CpfRequest:
      type: object
      properties:
        cpf:
          type: string
          maxLength: 20
          minLength: 0
      required:
      - cpf
    DefinirSenhaRequest:
      type: object
      properties:
        novaSenha:
          type: string
          maxLength: 200
          minLength: 0
        refreshToken:
          type: string
          maxLength: 200
          minLength: 0
        senhaAtual:
          type: string
          maxLength: 200
          minLength: 0
      required:
      - novaSenha
    ErroDoApp:
      type: object
      properties:
        mensagem:
          type: string
        pilha:
          type: string
        tela:
          type: string
        versao:
          type: string
    EsqueciSenhaRequest:
      type: object
      properties:
        email:
          type: string
          maxLength: 320
          minLength: 0
      required:
      - email
    Evento:
      type: object
      properties:
        acao:
          type: string
          enum:
          - CRIOU
          - EDITOU
          - APAGOU
          - IMPORTOU
          - PAGOU
          - MUDOU_PAPEL
          - REMOVEU
          - ENTROU
          - SAIU
          - CONVIDOU
        antes:
          type: string
        autor:
          type: string
          format: uuid
        depois:
          type: string
        entidade:
          type: string
        entidadeId:
          type: string
        id:
          type: integer
          format: int64
        quando:
          type: string
          format: date-time
    FamiliaResponse:
      type: object
      properties:
        convites:
          type: array
          items:
            $ref: "#/components/schemas/Convite"
        id:
          type: string
          format: uuid
        membros:
          type: array
          items:
            $ref: "#/components/schemas/Membro"
        nome:
          type: string
        plano:
          type: string
          enum:
          - GRATUITO
          - PREMIUM
        planoCasal:
          type: boolean
        planoFamilia:
          type: boolean
    FotoRequest:
      type: object
      properties:
        imagemBase64:
          type: string
          maxLength: 250000
          minLength: 0
        mimeType:
          type: string
          maxLength: 40
          minLength: 0
      required:
      - imagemBase64
      - mimeType
    GoogleLoginRequest:
      type: object
      properties:
        idToken:
          type: string
          maxLength: 4096
          minLength: 0
        lembrar:
          type: boolean
        refreshNoCorpo:
          type: boolean
        versaoDosTermos:
          type: string
          maxLength: 20
          minLength: 0
      required:
      - idToken
    Membro:
      type: object
      properties:
        email:
          type: string
        foto:
          type: string
        id:
          type: string
          format: uuid
        nome:
          type: string
        papel:
          type: string
          enum:
          - ADMIN
          - TITULAR
          - PARCEIRO
          - MEMBRO
        parceriaPendente:
          type: boolean
        premium:
          type: boolean
    MensagemDoPubSub:
      type: object
      properties:
        data:
          type: string
          maxLength: 100000
          minLength: 0
        messageId:
          type: string
        publishTime:
          type: string
      required:
      - data
    ModulosRequest:
      type: object
      properties:
        modulos:
          type: array
          items:
            type: string
          maxItems: 10
          minItems: 0
      required:
      - modulos
    NomeRequest:
      type: object
      properties:
        nome:
          type: string
          maxLength: 120
          minLength: 0
      required:
      - nome
    PaisRequest:
      type: object
      properties:
        documento:
          type: string
          maxLength: 40
          minLength: 0
        pais:
          type: string
          maxLength: 2
          minLength: 0
      required:
      - pais
    PapelRequest:
      type: object
      properties:
        papel:
          type: string
          enum:
          - ADMIN
          - TITULAR
          - PARCEIRO
          - MEMBRO
      required:
      - papel
    PlanoResponse:
      type: object
      properties:
        app:
          $ref: "#/components/schemas/Precos"
        appCasal:
          $ref: "#/components/schemas/Precos"
        appFamilia:
          $ref: "#/components/schemas/Precos"
        assinaturaDisponivel:
          type: boolean
        casaTemAssinatura:
          type: boolean
        casalDisponivel:
          type: boolean
        diasDeTeste:
          type: integer
          format: int32
        familiaDisponivel:
          type: boolean
        gratuito:
          type: array
          items:
            type: string
        origem:
          type: string
        pessoasNoFamilia:
          type: integer
          format: int32
        plano:
          type: string
          enum:
          - GRATUITO
          - PREMIUM
        planoCasal:
          type: boolean
        planoFamilia:
          type: boolean
        premium:
          type: array
          items:
            type: string
        premiumAte:
          type: string
          format: date-time
        reembolsoAte:
          type: string
          format: date-time
        site:
          $ref: "#/components/schemas/Precos"
        siteCasal:
          $ref: "#/components/schemas/Precos"
        siteFamilia:
          $ref: "#/components/schemas/Precos"
        voceAssinou:
          type: boolean
    Precos:
      type: object
      properties:
        anual:
          type: string
        mensal:
          type: string
    PreferencesRequest:
      type: object
      properties:
        fuso:
          type: string
          maxLength: 50
          minLength: 0
        moeda:
          type: string
          minLength: 1
          pattern: "[A-Z]{3}"
        moedaConversao:
          type: string
          minLength: 1
          pattern: "[A-Z]{3}"
        moedaCotacao:
          type: string
          pattern: "[A-Z]{3}"
        mostrarCotacao:
          type: boolean
      required:
      - moeda
      - moedaConversao
      - mostrarCotacao
    Preferencias:
      type: object
      properties:
        fuso:
          type: string
        idioma:
          type: string
        modulos:
          type: array
          items:
            type: string
        moeda:
          type: string
        moedaConversao:
          type: string
        moedaCotacao:
          type: string
        mostrarCotacao:
          type: boolean
    RedefinirSenhaRequest:
      type: object
      properties:
        novaSenha:
          type: string
          maxLength: 200
          minLength: 0
        token:
          type: string
          maxLength: 100
          minLength: 0
