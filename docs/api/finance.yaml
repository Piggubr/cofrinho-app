components:
  schemas:
    AccountRequest:
      type: object
      properties:
        compartilhado:
          type: boolean
        fechamento:
          type: integer
          format: int32
          maximum: 31
          minimum: 1
        nome:
          type: string
          maxLength: 60
          minLength: 0
        tipo:
          type: string
          enum:
          - CONTA
          - CARTAO
        vencimento:
          type: integer
          format: int32
          maximum: 31
          minimum: 1
      required:
      - nome
      - tipo
    Acerto:
      type: object
      properties:
        pagou:
          type: number
        parte:
          type: number
        pessoa:
          type: string
          format: uuid
        saldo:
          type: number
    ApiError:
      type: object
      properties:
        campos:
          type: array
          items:
            $ref: "#/components/schemas/CampoInvalido"
        codigo:
          type: string
        erro:
          type: string
        momento:
          type: string
          format: date-time
    AutorizacaoRequest:
      type: object
      properties:
        versaoDoAviso:
          type: string
          maxLength: 20
          minLength: 0
      required:
      - versaoDoAviso
    BillRequest:
      type: object
      properties:
        automatico:
          type: boolean
        categoria:
          type: string
          maxLength: 50
          minLength: 0
        compartilhado:
          type: boolean
        descricao:
          type: string
          maxLength: 200
          minLength: 0
        dia:
          type: integer
          format: int32
          maximum: 31
          minimum: 1
        valor:
          type: number
          maximum: 1000000
          minimum: 0.01
      required:
      - descricao
      - dia
      - valor
    BillResponse:
      type: object
      properties:
        automatico:
          type: boolean
        categoria:
          type: string
        compartilhado:
          type: boolean
        contaId:
          type: string
          format: uuid
        descricao:
          type: string
        dia:
          type: integer
          format: int32
        id:
          type: string
          format: uuid
        situacao:
          type: string
          enum:
          - PAGA
          - PENDENTE
          - VENCIDA
        tipo:
          type: string
          enum:
          - GASTO
          - RECEITA
        usuario:
          type: string
          format: uuid
        valor:
          type: number
        vencimento:
          type: string
          format: date
    BudgetRequest:
      type: object
      properties:
        categoria:
          type: string
          maxLength: 50
          minLength: 0
        limite:
          type: number
          maximum: 1000000
          minimum: 0.01
      required:
      - categoria
      - limite
    CampoInvalido:
      type: object
      properties:
        campo:
          type: string
        mensagem:
          type: string
    CategoriaNoAno:
      type: object
      properties:
        categoria:
          type: string
        total:
          type: number
    CategoriaNoMes:
      type: object
      properties:
        anterior:
          type: number
        categoria:
          type: string
        total:
          type: number
    CategoriesResponse:
      type: object
      properties:
        categorias:
          type: array
          items:
            type: string
    CategoryRequest:
      type: object
      properties:
        nome:
          type: string
          maxLength: 50
          minLength: 2
      required:
      - nome
    CompartilhamentoRequest:
      type: object
      properties:
        compartilhado:
          type: boolean
      required:
      - compartilhado
    ConferenciaDePreco:
      type: object
      properties:
        acima:
          type: boolean
        compras:
          type: integer
          format: int32
        media:
          type: number
        percentual:
          type: number
    Conta:
      type: object
      properties:
        compartilhado:
          type: boolean
        faturaAPagar:
          $ref: "#/components/schemas/Fatura"
        faturaAberta:
          $ref: "#/components/schemas/Fatura"
        fechamento:
          type: integer
          format: int32
        id:
          type: string
          format: uuid
        nome:
          type: string
        tipo:
          type: string
          enum:
          - CONTA
          - CARTAO
        usuario:
          type: string
          format: uuid
        vencimento:
          type: integer
          format: int32
    CurrencyResponse:
      type: object
      properties:
        codigo:
          type: string
        nome:
          type: string
    DepositRequest:
      type: object
      properties:
        data:
          type: string
          format: date
        objetivo:
          type: string
          format: uuid
        valor:
          type: number
          maximum: 10000000
          minimum: 0.01
      required:
      - valor
    DepositResponse:
