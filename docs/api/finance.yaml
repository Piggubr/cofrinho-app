openapi: 3.1.0
info:
  description: Contrato da API do Piggu. Regras de uso e de compatibilidade em docs/API_SPEC.md.
  title: piggu-finance
  version: "1"
servers:
- description: Producao
  url: https://piggu.com.br
- description: "Local, pelo gateway"
  url: http://localhost:8080
security:
- bearer: []
tags:
- description: Dinheiro que ainda vai entrar.
  name: A receber
- description: "Assistente de IA (Premium): perguntas sobre gastos, orçamento, contas\
    \ e cofrinho."
  name: Assistente
- description: Categorias de gasto e regras de categoria automática.
  name: Categorias
- description: Saldo e depósitos do cofrinho.
  name: Cofrinho
- description: "Contas, cartões e faturas."
  name: Contas e cartões
- description: Contas que vencem todo mês e receitas recorrentes.
  name: Contas fixas
- description: Cotação entre moedas.
  name: Câmbio
- description: "Gastos: lançar, listar, buscar, importar, exportar e dividir."
  name: Gastos
- description: "O que mudou na família, de quem a pessoa pode ver."
  name: Histórico
- description: Limite de gasto de cada mês.
  name: Metas do mês
- description: Notas da família; nota com valor cria um gasto junto.
  name: Notas
- description: Objetivos de poupança do cofrinho.
  name: Objetivos do cofrinho
- description: Limite de gasto por categoria no mês.
  name: Orçamentos
- description: Memória de preços do mercado.
  name: Preços
- description: Dinheiro que entrou.
  name: Receitas
- description: Leitura de recibos por foto.
  name: Recibos
- description: Relatórios do mês e do ano.
  name: Relatórios
paths:
  /api/accounts:
    get:
      operationId: accountListar
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conta"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Listar contas e cartões
      tags:
      - Contas e cartões
    post:
      operationId: accountCriar
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conta"
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Criar conta ou cartão
      tags:
      - Contas e cartões
  /api/accounts/{id}:
    delete:
      operationId: accountExcluir
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Excluir conta ou cartão
      tags:
      - Contas e cartões
  /api/accounts/{id}/sharing:
    put:
      operationId: accountCompartilhar
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompartilhamentoRequest"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Compartilhar ou não a conta com o casal
      tags:
      - Contas e cartões
  /api/accounts/{id}/statement:
    get:
      operationId: accountFatura
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: mes
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FaturaComGastos"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Fatura do cartão no mês
      tags:
      - Contas e cartões
  /api/accounts/{id}/statement/paid:
    delete:
      operationId: accountDesfazerPagamento
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: mes
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Desfazer o pagamento da fatura do cartão
      tags:
      - Contas e cartões
    put:
      operationId: accountPagarFatura
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: mes
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Marcar a fatura do cartão como paga
      tags:
      - Contas e cartões
  /api/assistant:
    get:
      operationId: assistantSituacao
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SituacaoDoAssistente"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Situação do assistente (uso e autorização)
      tags:
      - Assistente
  /api/assistant/ask:
    post:
      operationId: assistantPerguntar
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PerguntaRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resposta"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Fazer uma pergunta ao assistente
      tags:
      - Assistente
  /api/assistant/consent:
    delete:
      operationId: assistantRetirarConsentimento
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Retirar a autorização do assistente
      tags:
      - Assistente
    post:
      operationId: assistantAutorizar
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutorizacaoRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SituacaoDoAssistente"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Autorizar o envio das perguntas ao Gemini
      tags:
      - Assistente
  /api/bills:
    get:
      operationId: billListar
      parameters:
      - in: query
        name: mes
        required: false
        schema:
          type: string
      - in: query
        name: tipo
        required: false
        schema:
          type: string
          default: GASTO
          enum:
          - GASTO
          - RECEITA
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BillResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Contas fixas do mês
      tags:
      - Contas fixas
    post:
      operationId: billCriar
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillRequest"
        required: true
      responses:
        "201":
          description: Conta fixa criada
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Criar conta fixa
      tags:
      - Contas fixas
  /api/bills/{id}:
    delete:
      operationId: billExcluir
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Excluir conta fixa
      tags:
      - Contas fixas
    put:
      operationId: billAtualizar
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillRequest"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Alterar conta fixa
      tags:
      - Contas fixas
  /api/bills/{id}/pay:
    post:
      operationId: billPagar
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: mes
        required: false
        schema:
          type: string
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseResponse"
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Marcar conta fixa como paga no mês
      tags:
      - Contas fixas
  /api/budgets:
    get:
      operationId: budgetListar
      parameters:
      - in: query
        name: mes
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SituacaoDoOrcamento"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Orçamentos do mês por categoria
      tags:
      - Orçamentos
    put:
      operationId: budgetDefinir
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetRequest"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Definir o orçamento de uma categoria
      tags:
      - Orçamentos
  /api/budgets/{id}:
    delete:
      operationId: budgetExcluir
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Excluir orçamento
      tags:
      - Orçamentos
  /api/categories:
    get:
      operationId: categoryListar
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriesResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Listar categorias
      tags:
      - Categorias
    post:
      operationId: categoryCriar
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriesResponse"
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Criar categoria
      tags:
      - Categorias
  /api/categories/rules:
    get:
      operationId: categoryRegras
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Regra"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Listar regras de categoria automática
      tags:
      - Categorias
    put:
      operationId: categoryDefinirRegra
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Regra"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Criar ou trocar uma regra de categoria
      tags:
      - Categorias
  /api/categories/rules/{id}:
    delete:
      operationId: categoryExcluirRegra
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Excluir regra de categoria
      tags:
      - Categorias
  /api/exchange-rate:
    get:
      operationId: exchangeRateConsultar
      parameters:
      - in: query
        name: de
        required: false
        schema:
          type: string
          default: EUR
      - in: query
        name: para
        required: false
        schema:
          type: string
          default: BRL
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeRateResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Cotação entre duas moedas
      tags:
      - Câmbio
  /api/exchange-rate/currencies:
    get:
      operationId: exchangeRateMoedas
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CurrencyResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Moedas disponíveis
      tags:
      - Câmbio
  /api/expenses:
    get:
      operationId: expenseListar
      parameters:
      - in: query
        name: mes
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExpenseResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Listar gastos
      tags:
      - Gastos
    post:
      operationId: expenseSalvar
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveExpensesRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExpenseResponse"
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Lançar gasto
      tags:
      - Gastos
  /api/expenses/export:
    get:
      operationId: expenseExportar
      parameters:
      - in: query
        name: mes
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            text/csv:
              schema:
                type: string
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Exportar gastos em CSV
      tags:
      - Gastos
  /api/expenses/import:
    post:
      operationId: expenseImportar
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
                  format: int32
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Importar os gastos escolhidos
      tags:
      - Gastos
  /api/expenses/import/preview:
    post:
      operationId: expensePrevia
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtratoRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LinhaDaPrevia"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Prévia da importação de extrato (OFX ou CSV)
      tags:
      - Gastos
  /api/expenses/import/preview-lines:
    post:
      operationId: expensePreviaDeLinhas
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinhasRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LinhaDaPrevia"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Prévia da importação de linhas já separadas
      tags:
      - Gastos
  /api/expenses/search:
    get:
      operationId: expenseBuscar
      parameters:
      - in: query
        name: q
        required: true
        schema:
          type: string
          maxLength: 100
          minLength: 0
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExpenseResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Buscar gastos pelo item ou estabelecimento
      tags:
      - Gastos
  /api/expenses/splits:
    get:
      operationId: expenseAcerto
      parameters:
      - in: query
        name: mes
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Acerto"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Acerto dos gastos divididos no mês
      tags:
      - Gastos
  /api/expenses/splits/transfers:
    get:
      operationId: expenseQuemDeveAQuem
      parameters:
      - in: query
        name: mes
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transferencia"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Erro: corpo ApiError, com a mensagem pronta para a tela e\
            \ um código estável."
      summary: Quem deve a quem nos gastos divididos
      tags:
      - Gastos
  /api/expenses/{id}:
    delete:
      operationId: expenseExcluir
      parameters:
