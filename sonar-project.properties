# Analise do SonarQube Cloud, rodada pelo job "qualidade" do CI (.github/workflows/ci.yml).
# Passo a passo e o que fazer no site do Sonar: docs/qualidade-sonar.md.

# Chaves criadas ao importar o repositorio no SonarQube Cloud. Se o site mostrar outras
# (Information do projeto), troque aqui.
sonar.organization=piggubr
sonar.projectKey=Piggubr_cofrinho-app
sonar.projectName=Piggu

# Backend (modulos Maven) e front (Angular) num projeto so.
sonar.sources=backend,frontend/src
sonar.tests=backend,frontend/src
sonar.test.inclusions=backend/**/src/test/**,frontend/src/**/*.spec.ts
sonar.exclusions=backend/**/src/test/**,backend/**/target/**,frontend/src/**/*.spec.ts
sonar.sourceEncoding=UTF-8

# Java: classes compiladas pelo test-compile do job.
sonar.java.source=21
sonar.java.binaries=backend/*/target/classes
sonar.java.test.binaries=backend/*/target/test-classes

# Cobertura medida no CI (os pisos continuam no pom e no angular.json). Fora da conta o
# mesmo que os pisos ja deixam de fora: apoio de teste, demonstracao e rotas do front.
# No backend vai o relatorio unico do modulo piggu-cobertura: o do modulo so conta os
# testes dele, e o piggu-common e exercitado sobretudo pelos testes dos servicos.
sonar.coverage.jacoco.xmlReportPaths=backend/piggu-cobertura/target/site/jacoco-aggregate/jacoco.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/frontend/lcov.info
sonar.coverage.exclusions=backend/piggu-testing/**,frontend/src/app/testing/**,frontend/src/app/demo/**,frontend/src/app/**/*.routes.ts,frontend/src/main.ts

# Regras desligadas (o porque em docs/qualidade-sonar.md): estilo de shell e UPDATE sem
# WHERE nas migrations do Flyway, que corrigem todas as linhas de proposito.
sonar.issue.ignore.multicriteria=shell,migracoes
sonar.issue.ignore.multicriteria.shell.ruleKey=shelldre:S7688
sonar.issue.ignore.multicriteria.shell.resourceKey=**/*.sh
sonar.issue.ignore.multicriteria.migracoes.ruleKey=plsql:DeleteOrUpdateWithoutWhereCheck
sonar.issue.ignore.multicriteria.migracoes.resourceKey=**/db/migration/*.sql
