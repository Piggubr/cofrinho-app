name: Android nativo

# App Android em Kotlin (android-nativo/). Roda nos PRs que mexem nele: compila todas as
# variantes, passa o lint, os testes unitários e confere as capturas Roborazzi contra as
# de android-nativo/docs/prints/. Não publica nada no Google Play.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android-nativo/**'
      - '.github/workflows/android-nativo.yml'
      # Os Termos e o Aviso de Privacidade do app são cópias destes (D-083).
      - 'frontend/src/app/features/legal/**'
      - 'frontend/src/app/core/privacidade/aviso.ts'

permissions:
  contents: read

# Um push novo num PR cancela o build do commit anterior dele.
concurrency:
  group: android-nativo-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build e testes (Android nativo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-nativo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # O gradle-wrapper.jar é um binário no repositório: confere que é o oficial.
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android-nativo/**/*.gradle.kts
            android-nativo/gradle/libs.versions.toml
            android-nativo/gradle/wrapper/gradle-wrapper.properties

      - name: Termos e Aviso de Privacidade iguais aos do site
        run: |
          python3 -I scripts/textos-legais.py
          git diff --exit-code -- feature/legal/src/main/assets || {
            echo "::error::O texto legal do site mudou. Rode python3 android-nativo/scripts/textos-legais.py e faça o commit."
            exit 1
          }

      - name: Build, lint e testes
        run: ./gradlew --no-daemon build

      - name: Capturas Roborazzi
        run: ./gradlew --no-daemon verifyRoborazziDemoDebug

      - name: Guardar relatórios e diferenças das capturas
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-nativo-relatorios
          path: |
            android-nativo/**/build/reports/
            android-nativo/app/build/outputs/roborazzi/
          retention-days: 14

  # O AAB de produção assinado com a chave de upload, guardado como artefato. Não envia ao Play
  # Console: o envio é manual, com a confirmação do Dudu. Sem os secrets, sai sem assinatura.
  # Só à mão, na main, no ambiente assinatura-android: a chave nunca chega ao código de um PR,
  # e o ambiente só libera os secrets para a main (D-153).
  aab:
    name: AAB de produção (Android nativo)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: assinatura-android
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-nativo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android-nativo/**/*.gradle.kts
            android-nativo/gradle/libs.versions.toml
            android-nativo/gradle/wrapper/gradle-wrapper.properties

      - name: Chave de upload (dos secrets, só neste job)
        env:
          CHAVE_BASE64: ${{ secrets.PIGGU_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$CHAVE_BASE64" ]; then
            echo "$CHAVE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "PIGGU_UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Sem PIGGU_UPLOAD_KEYSTORE_BASE64: o AAB sai sem assinatura."
          fi

      - name: AAB de produção
        env:
          PIGGU_UPLOAD_KEYSTORE_SENHA: ${{ secrets.PIGGU_UPLOAD_KEYSTORE_SENHA }}
          PIGGU_UPLOAD_KEY_ALIAS: ${{ secrets.PIGGU_UPLOAD_KEY_ALIAS }}
          PIGGU_UPLOAD_KEY_SENHA: ${{ secrets.PIGGU_UPLOAD_KEY_SENHA }}
        run: ./gradlew --no-daemon :app:bundleProducaoRelease

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: piggu-android-aab
          path: android-nativo/app/build/outputs/bundle/producaoRelease/*.aab
          retention-days: 30

