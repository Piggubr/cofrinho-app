name: CI

# Branches (regras em docs/branches.md):
#   main     producao. O merge de um PR roda o CI e, se tudo passar, "publicar" atualiza
#            o servidor. So recebe PR vindo da develop (ou hotfix/...).
#   develop  onde as features se juntam. Roda o CI, nunca publica.
#   outras   rodam o CI pelo PR ou na mao (Actions > CI > Run workflow): testes,
#            cobertura e seguranca. O .ipa de teste sai pelo "iOS demo". Nao publicam.
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # PR para a main so vem da develop ou de um hotfix/...: assim tudo que chega em
  # producao passou antes pela develop (ou e uma correcao urgente com nome proprio).
  # Este job e um "required status check" da regra da main (.github/rulesets/main.json).
  origem-do-pr:
    name: Origem do PR para a main
    runs-on: ubuntu-latest
    steps:
      - name: Conferir a branch de origem
        env:
          BASE: ${{ github.base_ref }}
          ORIGEM: ${{ github.head_ref }}
        run: |
          if [[ "$BASE" != "main" ]]; then
            echo "PR para ${BASE:-nenhuma branch}: sem restricao de origem."
          elif [[ "$ORIGEM" == "develop" || "$ORIGEM" == hotfix/* ]]; then
            echo "PR de $ORIGEM para a main: ok."
          else
            echo "::error::PR para a main precisa vir da develop ou de hotfix/... (veio de $ORIGEM)."
            exit 1
          fi

  segredos:
    name: Segredos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historico inteiro: segredo apagado num commit continua no Git.
          fetch-depth: 0
      # Binario do gitleaks direto: e gratis e, ao contrario da action, nao pede
      # GITLEAKS_LICENSE em repositorio de organizacao. Versao e hash fixos.
      - name: Instalar gitleaks
        env:
          VERSAO: 8.28.0
          SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSAO}/gitleaks_${VERSAO}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz -C "$RUNNER_TEMP" gitleaks
          rm gitleaks.tgz
      - name: Procurar segredos no historico
        run: '"$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner -v .'

  backup:
    name: Backup e restauracao
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck -x backend/scripts/*.sh backend/db/init/*.sh scripts/*.sh
      # Postgres descartavel: backup cifrado, rotacao, restauracao testada e por cima.
      - run: backend/scripts/teste-do-backup.sh
      # Um usuario do Postgres por servico, isolado, e a atualizacao de instalacao antiga.
      - run: backend/scripts/teste-dos-usuarios.sh
      # Dados de exemplo do dev sobre as migracoes reais, so na familia pedida.
      - run: backend/scripts/teste-dos-dados-de-exemplo.sh

  # Configuracao do monitoramento (backend/observabilidade): um erro aqui so apareceria no
  # servidor, com o Grafana ou o Prometheus caindo depois do deploy. Mesmas versoes do Compose.
  observabilidade:
    name: Monitoramento (configuracao)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compose com todos os perfis
        run: >-
          GOOGLE_CLIENT_ID=x DOMINIO=x EMAIL_DO_CERTIFICADO=x
          docker compose --profile producao --profile observabilidade --profile open-finance config -q
      - name: Prometheus
        run: >-
          docker run --rm -v "$PWD/observabilidade/prometheus:/c:ro" --entrypoint promtool
          prom/prometheus:v3.13.4 check config /c/prometheus.yml
      - name: Loki
        run: docker run --rm -v "$PWD/observabilidade/loki:/c:ro" grafana/loki:3.7.8 -config.file=/c/loki.yml -verify-config
      - name: Alloy
        run: docker run --rm -v "$PWD/observabilidade/alloy:/c:ro" grafana/alloy:v1.20.1 fmt /c/config.alloy > /dev/null
      - name: Paineis e provisionamento do Grafana
        run: |
          for f in observabilidade/grafana/paineis/*.json; do jq -e '.uid and .title and (.panels | length > 0)' "$f" > /dev/null; done
          for f in observabilidade/grafana/provisionamento/*/*.yml; do python3 -c 'import sys, yaml; yaml.safe_load(open(sys.argv[1]))' "$f"; done
      - run: shellcheck -x ../deploy/atualizar.sh

  backend:
    name: Backend (mvn verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Os testes de integracao sobem PostgreSQL via Testcontainers; o runner
      # ubuntu-latest ja traz Docker. O verify tambem confere o piso de cobertura
      # do JaCoCo (propriedades cobertura.* no pom de cada modulo, que so sobem).
      - run: mvn -B verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cobertura-do-backend
          path: backend/*/target/site/jacoco/
          retention-days: 14

  dependencias-do-backend:
    name: Vulnerabilidades nas dependencias do backend (OSV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # O npm audit cobre o front. Aqui o proprio Maven resolve as dependencias (com as
      # transitivas e os modulos internos, que o OSV nao acha sozinho no Maven Central) e
      # grava um SBOM CycloneDX; o OSV le o SBOM e falha se algo tem vulnerabilidade.
      - working-directory: backend
        run: >-
          mvn -B -q -DskipTests -Djacoco.skip=true package
          org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom
          -DoutputFormat=json -DoutputName=bom
      - run: |
          curl -sSfL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          chmod +x osv-scanner
          ./osv-scanner scan source -L backend/target/bom.json

  frontend:
    name: Frontend (build + testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Falha com vulnerabilidade alta ou critica conhecida nas dependencias.
      - run: npm audit --audit-level=high
      - run: npm run build
      # A demonstracao (dados de exemplo) so pode existir no build "demo".
      - run: "! grep -rq token-da-demonstracao dist/frontend/browser"
      # O piso de cobertura fica no angular.json (coverageThresholds) e so sobe.
      - run: npx ng test --watch=false --coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cobertura-do-front
          path: frontend/coverage/
          retention-days: 14

  e2e:
    name: Ponta a ponta (Playwright na demo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: relatorio-do-playwright
          path: frontend/playwright-report/
          retention-days: 14

  # O backend inteiro do jeito que vai para o servidor (imagens do Dockerfile, Postgres novo
  # com as migracoes reais, gateway e JWKS) e o front com o proxy de /api, no navegador.
  # Smoke: cadastro, e-mail, login, sessao, senha e um gasto. Regressao: o que ja quebrou.
  stack:
    name: Smoke e regressao (stack inteira)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Acento quebrado em mensagem (18/10): falha antes de gastar tempo com o build.
      - run: bash scripts/conferir-acentos.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - run: bash scripts/smoke.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: relatorio-da-stack
          path: frontend/playwright-report-stack/
          retention-days: 14

  # Atualiza o servidor depois que todos os jobs acima passam num push na main (a
  # branch de producao). Desligado ate a variavel DEPLOY_LIGADO=true existir no
  # repositorio (Settings > Secrets and variables > Actions > Variables); os segredos
  # ficam no ambiente "producao", que so aceita a main. Passo a passo em
  # docs/implantacao-producao.md, secao 8.
  publicar:
    name: Publicar no servidor
    needs: [segredos, backup, backend, frontend, e2e, stack]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.DEPLOY_LIGADO == 'true'
    runs-on: ubuntu-latest
    environment: producao
    timeout-minutes: 40
    concurrency:
      group: publicar-producao
      cancel-in-progress: false
    steps:
      - name: Preparar a chave SSH
        env:
          CHAVE: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CHAVE" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          # A identidade do servidor vem do segredo: sem ela o ssh recusa (nada de
          # aceitar a primeira chave que aparecer).
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
      # No servidor, a chave so roda deploy/atualizar.sh, que confere se o commit esta
      # na branch de producao, compila, sobe e espera os servicos ficarem saudaveis.
      - name: Atualizar o servidor
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          # Usuario do servidor; o guia cria o "ubuntu" em qualquer provedor.
          USUARIO: ${{ vars.DEPLOY_USUARIO || 'ubuntu' }}
        run: ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes -o BatchMode=yes "$USUARIO@$HOST" "$GITHUB_SHA"
