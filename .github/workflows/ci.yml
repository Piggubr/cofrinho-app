name: CI

# Branches (regras em docs/branches.md):
#   main     producao. O merge de um PR roda o CI e, se tudo passar, "publicar" atualiza
#            o servidor. So recebe PR vindo da develop (ou hotfix/...).
#   develop  onde as features se juntam. Roda o CI, nunca publica.
#   outras   rodam o CI pelo PR ou na mao (Actions > CI > Run workflow): testes,
#            cobertura e seguranca. O .ipa de teste sai pelo "iOS demo". Nao publicam.
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # PR para a main so vem da develop ou de um hotfix/...: assim tudo que chega em
  # producao passou antes pela develop (ou e uma correcao urgente com nome proprio).
  # Este job e um "required status check" da regra da main (.github/rulesets/main.json).
  origem-do-pr:
    name: Origem do PR para a main
    runs-on: ubuntu-latest
    steps:
      - name: Conferir a branch de origem
        env:
          BASE: ${{ github.base_ref }}
          ORIGEM: ${{ github.head_ref }}
        run: |
          if [[ "$BASE" != "main" ]]; then
            echo "PR para ${BASE:-nenhuma branch}: sem restricao de origem."
          elif [[ "$ORIGEM" == "develop" || "$ORIGEM" == hotfix/* ]]; then
            echo "PR de $ORIGEM para a main: ok."
          else
            echo "::error::PR para a main precisa vir da develop ou de hotfix/... (veio de $ORIGEM)."
            exit 1
          fi

  segredos:
    name: Segredos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historico inteiro: segredo apagado num commit continua no Git.
          fetch-depth: 0
      # Binario do gitleaks direto: e gratis e, ao contrario da action, nao pede
      # GITLEAKS_LICENSE em repositorio de organizacao. Versao e hash fixos.
      - name: Instalar gitleaks
        env:
          VERSAO: 8.28.0
          SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSAO}/gitleaks_${VERSAO}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz -C "$RUNNER_TEMP" gitleaks
          rm gitleaks.tgz
      - name: Procurar segredos no historico
        run: '"$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner -v .'

  backup:
    name: Backup e restauracao
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x backend/scripts/*.sh backend/db/init/*.sh scripts/*.sh
      # Postgres descartavel: backup cifrado, rotacao, restauracao testada e por cima.
      - run: backend/scripts/teste-do-backup.sh
      # Um usuario do Postgres por servico, isolado, e a atualizacao de instalacao antiga.
      - run: backend/scripts/teste-dos-usuarios.sh
      # Dados de exemplo do dev sobre as migracoes reais, so na familia pedida.
      - run: backend/scripts/teste-dos-dados-de-exemplo.sh

  backend:
    name: Backend (mvn verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Os testes de integracao sobem PostgreSQL via Testcontainers; o runner
      # ubuntu-latest ja traz Docker. O verify tambem confere o piso de cobertura
      # do JaCoCo (propriedades cobertura.* no pom de cada modulo, que so sobem).
      - run: mvn -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-do-backend
          path: backend/*/target/site/jacoco/
          retention-days: 14

  frontend:
    name: Frontend (build + testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Falha com vulnerabilidade alta ou critica conhecida nas dependencias.
      - run: npm audit --audit-level=high
      - run: npm run build
      # A demonstracao (dados de exemplo) so pode existir no build "demo".
      - run: "! grep -rq token-da-demonstracao dist/frontend/browser"
      # O piso de cobertura fica no angular.json (coverageThresholds) e so sobe.
      - run: npx ng test --watch=false --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-do-front
          path: frontend/coverage/
          retention-days: 14

  e2e:
    name: Ponta a ponta (Playwright na demo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: relatorio-do-playwright
          path: frontend/playwright-report/
          retention-days: 14

  # Atualiza o servidor depois que todos os jobs acima passam num push na main (a
  # branch de producao). Desligado ate a variavel DEPLOY_LIGADO=true existir no
  # repositorio (Settings > Secrets and variables > Actions > Variables); os segredos
  # ficam no ambiente "producao", que so aceita a main. Passo a passo em
  # docs/implantacao-producao.md, secao 8.
  publicar:
    name: Publicar no servidor
    needs: [segredos, backup, backend, frontend, e2e]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.DEPLOY_LIGADO == 'true'
    runs-on: ubuntu-latest
    environment: producao
    timeout-minutes: 40
    concurrency:
      group: publicar-producao
      cancel-in-progress: false
    steps:
      - name: Preparar a chave SSH
        env:
          CHAVE: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CHAVE" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          # A identidade do servidor vem do segredo: sem ela o ssh recusa (nada de
          # aceitar a primeira chave que aparecer).
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
      # No servidor, a chave so roda deploy/atualizar.sh, que confere se o commit esta
      # na branch de producao, compila, sobe e espera os servicos ficarem saudaveis.
      - name: Atualizar o servidor
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          # Usuario do servidor; o guia cria o "ubuntu" em qualquer provedor.
          USUARIO: ${{ vars.DEPLOY_USUARIO || 'ubuntu' }}
        run: ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes -o BatchMode=yes "$USUARIO@$HOST" "$GITHUB_SHA"
