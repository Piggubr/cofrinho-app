name: CI

# Branches (regras em docs/branches.md):
#   main     producao. O merge de um PR roda o CI e, se tudo passar, "publicar" atualiza
#            o servidor. So recebe PR vindo da develop (ou hotfix/...).
#   develop  onde as features se juntam. Roda o CI, nunca publica.
#   outras   rodam o CI pelo PR ou na mao (Actions > CI > Run workflow): testes,
#            cobertura e seguranca. O .ipa de teste sai pelo "iOS demo". Nao publicam.
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Um push novo num PR cancela o CI que ainda rodava para o commit anterior dele. Push na
# main ou na develop e a execucao na mao tem grupo proprio (run_id): nunca sao canceladas,
# entao um deploy em andamento nao e interrompido.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # PR para a main so vem da develop ou de um hotfix/...: assim tudo que chega em
  # producao passou antes pela develop (ou e uma correcao urgente com nome proprio).
  # Este job e um "required status check" da regra da main (.github/rulesets/main.json).
  origem-do-pr:
    name: Origem do PR para a main
    runs-on: ubuntu-latest
    steps:
      - name: Conferir a branch de origem
        env:
          BASE: ${{ github.base_ref }}
          ORIGEM: ${{ github.head_ref }}
        run: |
          if [[ "$BASE" != "main" ]]; then
            echo "PR para ${BASE:-nenhuma branch}: sem restricao de origem."
          elif [[ "$ORIGEM" == "develop" || "$ORIGEM" == hotfix/* ]]; then
            echo "PR de $ORIGEM para a main: ok."
          else
            echo "::error::PR para a main precisa vir da develop ou de hotfix/... (veio de $ORIGEM)."
            exit 1
          fi

  segredos:
    name: Segredos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historico inteiro: segredo apagado num commit continua no Git.
          fetch-depth: 0
      # Binario do gitleaks direto: e gratis e, ao contrario da action, nao pede
      # GITLEAKS_LICENSE em repositorio de organizacao. Versao e hash fixos.
      - name: Instalar gitleaks
        env:
          VERSAO: 8.28.0
          SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSAO}/gitleaks_${VERSAO}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz -C "$RUNNER_TEMP" gitleaks
          rm gitleaks.tgz
      - name: Procurar segredos no historico
        run: '"$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner -v .'

  # Lint: ESLint no front (regras do angular-eslint, com acessibilidade dos templates) e
  # Checkstyle no backend (backend/checkstyle.xml). Rapido, entao falha antes dos testes.
  lint:
    name: Lint (ESLint e Checkstyle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A branch de destino do PR, para saber quais arquivos ele mexeu.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - working-directory: frontend
        run: npm ci
      - name: ESLint
        working-directory: frontend
        run: npm run lint
      # Prettier so nos arquivos que o PR mexeu, e so como aviso: boa parte do front ainda
      # nao passou por ele, e formatar tudo de uma vez embolaria os PRs abertos.
      - name: Formatacao dos arquivos do PR (aviso)
        if: github.event_name == 'pull_request'
        working-directory: frontend
        env:
          BASE: ${{ github.base_ref }}
        run: |
          mapfile -t arquivos < <(git diff --name-only --relative --diff-filter=ACMR "origin/$BASE...HEAD" -- src \
            | grep -E '\.(ts|html|scss)$' || true)
          [ ${#arquivos[@]} -eq 0 ] && exit 0
          npx prettier --list-different "${arquivos[@]}" | while read -r f; do
            echo "::warning file=frontend/$f::Fora do Prettier. Para arrumar: cd frontend && npx prettier --write $f"
          done || true
      - name: Checkstyle
        working-directory: backend
        run: mvn -B -q validate

  backup:
    name: Backup e restauracao
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck -x backend/scripts/*.sh backend/db/init/*.sh scripts/*.sh
      # Postgres descartavel: backup cifrado, rotacao, restauracao testada e por cima.
      - run: backend/scripts/teste-do-backup.sh
      # Um usuario do Postgres por servico, isolado, e a atualizacao de instalacao antiga.
      - run: backend/scripts/teste-dos-usuarios.sh
      # Dados de exemplo do dev sobre as migracoes reais, so na familia pedida.
      - run: backend/scripts/teste-dos-dados-de-exemplo.sh

  # Configuracao do monitoramento (backend/observabilidade): um erro aqui so apareceria no
  # servidor, com o Grafana ou o Prometheus caindo depois do deploy. Mesmas versoes do Compose.
  observabilidade:
    name: Monitoramento (configuracao)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compose com todos os perfis
        run: >-
          GOOGLE_CLIENT_ID=x DOMINIO=x EMAIL_DO_CERTIFICADO=x
          docker compose --profile producao --profile observabilidade --profile open-finance config -q
      - name: Prometheus
        run: >-
          docker run --rm -v "$PWD/observabilidade/prometheus:/c:ro" --entrypoint promtool
          prom/prometheus:v3.13.4 check config /c/prometheus.yml
      - name: Loki
        run: docker run --rm -v "$PWD/observabilidade/loki:/c:ro" grafana/loki:3.7.8 -config.file=/c/loki.yml -verify-config
      - name: Alloy
        run: docker run --rm -v "$PWD/observabilidade/alloy:/c:ro" grafana/alloy:v1.20.1 fmt /c/config.alloy > /dev/null
      - name: Paineis e provisionamento do Grafana
        run: |
          for f in observabilidade/grafana/paineis/*.json; do jq -e '.uid and .title and (.panels | length > 0)' "$f" > /dev/null; done
          for f in observabilidade/grafana/provisionamento/*/*.yml; do python3 -c 'import sys, yaml; yaml.safe_load(open(sys.argv[1]))' "$f"; done
      - run: shellcheck -x ../deploy/atualizar.sh

  backend:
    name: Backend (mvn verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Os testes de integracao sobem PostgreSQL via Testcontainers; o runner
      # ubuntu-latest ja traz Docker. O verify tambem confere o piso de cobertura
      # do JaCoCo (propriedades cobertura.* no pom de cada modulo, que so sobem).
      - run: mvn -B verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cobertura-do-backend
          # Por modulo (o piso) e o relatorio unico do piggu-cobertura, que vai para o Sonar.
          path: |
            backend/*/target/site/jacoco/
            backend/piggu-cobertura/target/site/jacoco-aggregate/
          retention-days: 14

  dependencias-do-backend:
    name: Vulnerabilidades nas dependencias do backend (OSV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # O npm audit cobre o front. Aqui o proprio Maven resolve as dependencias (com as
      # transitivas e os modulos internos, que o OSV nao acha sozinho no Maven Central) e
      # grava um SBOM CycloneDX; o OSV le o SBOM e falha se algo tem vulnerabilidade.
      - working-directory: backend
        run: >-
          mvn -B -q -DskipTests -Djacoco.skip=true package
          org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom
          -DoutputFormat=json -DoutputName=bom
      - run: |
          curl -sSfL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          chmod +x osv-scanner
          ./osv-scanner scan source -L backend/target/bom.json

  frontend:
    name: Frontend (build + testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Falha com vulnerabilidade alta ou critica conhecida nas dependencias.
      - run: npm audit --audit-level=high
      - run: npm run build
      # A demonstracao (dados de exemplo) so pode existir no build "demo".
      - run: "! grep -rq token-da-demonstracao dist/frontend/browser"
      # O piso de cobertura fica no angular.json (coverageThresholds) e so sobe.
      - run: npx ng test --watch=false --coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cobertura-do-front
          path: frontend/coverage/
          retention-days: 14

  e2e:
    name: Ponta a ponta (Playwright na demo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: relatorio-do-playwright
          path: frontend/playwright-report/
          retention-days: 14

  # O backend inteiro do jeito que vai para o servidor (imagens do Dockerfile, Postgres novo
  # com as migracoes reais, gateway e JWKS) e o front com o proxy de /api, no navegador.
  # Smoke: cadastro, e-mail, login, sessao, senha e um gasto. Regressao: o que ja quebrou.
  stack:
    name: Smoke e regressao (stack inteira)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Acento quebrado em mensagem (18/10): falha antes de gastar tempo com o build.
      - run: bash scripts/conferir-acentos.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - run: bash scripts/smoke.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: relatorio-da-stack
          path: frontend/playwright-report-stack/
          retention-days: 14

  # Qualidade do codigo no SonarQube Cloud (bugs, code smells, duplicacao, falhas de
  # seguranca e a cobertura dos jobs backend e frontend), num projeto so para os dois.
  # Desligado ate a variavel SONAR_LIGADO=true e o segredo SONAR_TOKEN existirem no
  # repositorio. Informativo: nao trava o merge nem o "publicar". Passo a passo em
  # docs/qualidade-sonar.md. PR de fork e do Dependabot nao recebem o segredo, entao pulam.
  # O plano Free (repositorio privado) so analisa a develop, a branch principal do projeto
  # no Sonar, e os PRs para ela; na main a analise seria recusada.
  qualidade:
    name: Qualidade do codigo (SonarQube Cloud)
    needs: [backend, frontend]
    if: >-
      vars.SONAR_LIGADO == 'true' &&
      github.actor != 'dependabot[bot]' &&
      ((github.event_name == 'pull_request' &&
        github.base_ref == 'develop' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historico inteiro: o Sonar usa o blame para saber o que e codigo novo.
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # O analisador de Java precisa das classes compiladas; os testes ja rodaram no job backend.
      - working-directory: backend
        run: mvn -B -q -Djacoco.skip=true test-compile
      # Cobertura medida nos jobs backend (JaCoCo) e frontend (lcov), de volta no lugar.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cobertura-do-backend
          path: backend
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cobertura-do-front
          path: frontend/coverage
      # O que analisar fica no sonar-project.properties, na raiz.
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # As imagens que vao para o servidor: compiladas uma vez aqui, conferidas pelo Trivy e,
  # num push na main, publicadas no GitHub (ghcr.io/piggubr/cofrinho-app/<servico>:<sha>).
  # O deploy so baixa: o que vai ao ar e exatamente o que foi conferido. O Trivy por
  # enquanto so informa (nao falha); o resultado fica no log deste job.
  # As imagens sao da plataforma do servidor, nao da do CI: o servidor da Oracle e ARM
  # (linux/arm64). Servidor Intel: crie a variavel PIGGU_PLATAFORMA=linux/amd64.
  #
  # O mesmo job duas vezes (o segundo repete env e passos pelo anchor do YAML), so com o
  # token diferente. Aqui roda codigo de dependencia (npm ci, build da imagem): num PR, do
  # Dependabot inclusive, o token so le, para ninguem conseguir reescrever imagem no
  # registro. So o "na main", com o codigo ja na branch, escreve e publica.
  imagens:
    name: Imagens Docker (Trivy e GHCR)
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env: &env-das-imagens
      PIGGU_IMAGENS: ghcr.io/piggubr/cofrinho-app
      PIGGU_VERSAO: ${{ github.sha }}
      PLATAFORMA: ${{ vars.PIGGU_PLATAFORMA || 'linux/arm64' }}
      # Obrigatorias no Compose, mas so usadas com os servicos de pe.
      GOOGLE_CLIENT_ID: x
      DOMINIO: x
      EMAIL_DO_CERTIFICADO: x
      SERVICOS: identity finance rewards lifestyle media gateway web
    steps: &passos-das-imagens
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # O token nao fica no .git/config, ao alcance do npm ci e do build.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # A imagem "web" (Caddy) leva o site compilado.
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run build
      # Emulador para os poucos passos da imagem final que rodam na plataforma do servidor
      # (o apk do Tesseract, o usuario sem privilegios). O Maven roda nativo.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Montar as imagens
        working-directory: backend
        # So neste passo: no job inteiro, o proprio emulador baixaria na plataforma errada.
        env:
          DOCKER_DEFAULT_PLATFORM: ${{ env.PLATAFORMA }}
        run: |
          # SERVICOS e uma lista separada por espacos, de proposito sem aspas.
          # shellcheck disable=SC2086
          docker compose --profile producao build $SERVICOS
      # Imagem de outra plataforma baixa no servidor, mas nao roda (23/10).
      - name: Conferir a plataforma das imagens
        run: |
          for servico in $SERVICOS; do
            plataforma=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$PIGGU_IMAGENS/$servico:$PIGGU_VERSAO")
            echo "$servico: $plataforma"
            if [[ $plataforma != "$PLATAFORMA" ]]; then
              echo "::error::A imagem $servico e $plataforma, e o servidor espera $PLATAFORMA"
              exit 1
            fi
          done
      # Binario do Trivy direto, como o gitleaks: versao e hash fixos.
      - name: Instalar o Trivy
        env:
          VERSAO: 0.76.1
          SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
        run: |
          curl -sSfL -o trivy.tgz \
            "https://github.com/aquasecurity/trivy/releases/download/v${VERSAO}/trivy_${VERSAO}_Linux-64bit.tar.gz"
          echo "${SHA256}  trivy.tgz" | sha256sum -c -
          tar -xzf trivy.tgz -C "$RUNNER_TEMP" trivy
          rm trivy.tgz
      # Falhas altas e criticas que ja tem correcao, no sistema da imagem e nas bibliotecas.
      - name: Vulnerabilidades nas imagens (Trivy)
        run: |
          for servico in $SERVICOS; do
            echo "::group::$servico"
            "$RUNNER_TEMP/trivy" image --quiet --scanners vuln --severity HIGH,CRITICAL \
              --ignore-unfixed --exit-code 0 "$PIGGU_IMAGENS/$servico:$PIGGU_VERSAO"
            echo "::endgroup::"
          done
      - name: Publicar as imagens no GitHub (ghcr.io)
        id: publicacao
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: backend
        env:
          TOKEN: ${{ github.token }}
          USUARIO: ${{ github.actor }}
        run: |
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$USUARIO" --password-stdin
          # shellcheck disable=SC2086
          docker compose --profile producao push $SERVICOS
          docker logout ghcr.io
          # O servidor baixa por estes digests, nao pela tag: tag no registro pode ser reescrita.
          digests=""
          for servico in $SERVICOS; do
            digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$PIGGU_IMAGENS/$servico:$PIGGU_VERSAO")
            digests+="$servico@${digest#*@} "
          done
          echo "digests=${digests% }" >> "$GITHUB_OUTPUT"

  imagens-da-main:
    name: Imagens Docker (Trivy e GHCR) na main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      digests: ${{ steps.publicacao.outputs.digests }}
    env: *env-das-imagens
    steps: *passos-das-imagens

  # Atualiza o servidor depois que todos os jobs acima passam num push na main (a
  # branch de producao). Desligado ate a variavel DEPLOY_LIGADO=true existir no
  # repositorio (Settings > Secrets and variables > Actions > Variables); os segredos
  # ficam no ambiente "producao", que so aceita a main. Passo a passo em
  # docs/implantacao-producao.md, secao 8.
  publicar:
    name: Publicar no servidor
    needs:
      - segredos
      - lint
      - backup
      - observabilidade
      - backend
      - dependencias-do-backend
      - frontend
      - e2e
      - stack
      - imagens-da-main
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.DEPLOY_LIGADO == 'true'
    runs-on: ubuntu-latest
    environment: producao
    # O token deste job vai para o servidor baixar as imagens: so le, e morre com o job.
    permissions:
      contents: read
      packages: read
    timeout-minutes: 40
    concurrency:
      group: publicar-producao
      cancel-in-progress: false
    steps:
      - name: Preparar a chave SSH
        env:
          CHAVE: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CHAVE" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          # A identidade do servidor vem do segredo: sem ela o ssh recusa (nada de
          # aceitar a primeira chave que aparecer).
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
      # No servidor, a chave so roda deploy/atualizar.sh, que confere se o commit esta
      # na branch de producao, baixa as imagens, sobe e espera os servicos ficarem
      # saudaveis; se nao ficarem, volta sozinho para a versao anterior e o job falha.
      # O token vai pela entrada, nunca na linha de comando; na linha seguinte, os digests
      # das imagens que este CI publicou, que sao as unicas que o servidor aceita baixar.
      - name: Atualizar o servidor
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          # Usuario do servidor; o guia cria o "ubuntu" em qualquer provedor.
          USUARIO: ${{ vars.DEPLOY_USUARIO || 'ubuntu' }}
          TOKEN: ${{ github.token }}
          DIGESTS: ${{ needs.imagens-da-main.outputs.digests }}
        run: >-
          printf '%s\n%s\n' "$TOKEN" "$DIGESTS" |
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes -o BatchMode=yes "$USUARIO@$HOST" "$GITHUB_SHA"

  # Cada publicacao vira uma versao em Releases: tag vAAAA.MM.DD (.2, .3... se sair mais de
  # uma no dia) e as notas geradas dos PRs que entraram desde a versao anterior. E o
  # changelog do app e o numero que as lojas vao pedir.
  versao:
    name: Versao e notas
    needs: publicar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Criar a versao
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          base="v$(TZ=America/Sao_Paulo date +%Y.%m.%d)"
          tag=$base
          n=1
          while gh api "repos/$GH_REPO/git/ref/tags/$tag" > /dev/null 2>&1; do
            n=$((n + 1))
            tag="$base.$n"
          done
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
