name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  segredos:
    name: Segredos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historico inteiro: segredo apagado num commit continua no Git.
          fetch-depth: 0
      # Binario do gitleaks direto: e gratis e, ao contrario da action, nao pede
      # GITLEAKS_LICENSE em repositorio de organizacao. Versao e hash fixos.
      - name: Instalar gitleaks
        env:
          VERSAO: 8.28.0
          SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSAO}/gitleaks_${VERSAO}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz -C "$RUNNER_TEMP" gitleaks
          rm gitleaks.tgz
      - name: Procurar segredos no historico
        run: '"$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner -v .'

  backup:
    name: Backup e restauracao
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x backend/scripts/*.sh backend/db/init/*.sh scripts/*.sh
      # Postgres descartavel: backup cifrado, rotacao, restauracao testada e por cima.
      - run: backend/scripts/teste-do-backup.sh

  backend:
    name: Backend (mvn verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Os testes de integracao sobem PostgreSQL via Testcontainers; o runner
      # ubuntu-latest ja traz Docker.
      - run: mvn -B verify

  frontend:
    name: Frontend (build + testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Falha com vulnerabilidade alta ou critica conhecida nas dependencias.
      - run: npm audit --audit-level=high
      - run: npm run build
      # A demonstracao (dados de exemplo) so pode existir no build "demo".
      - run: "! grep -rq token-da-demonstracao dist/frontend/browser"
      # O piso de cobertura fica no angular.json (coverageThresholds) e so sobe.
      - run: npx ng test --watch=false --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-do-front
          path: frontend/coverage/
          retention-days: 14

  e2e:
    name: Ponta a ponta (Playwright na demo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: relatorio-do-playwright
          path: frontend/playwright-report/
          retention-days: 14
