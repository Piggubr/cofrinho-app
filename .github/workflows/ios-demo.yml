name: iOS demo (IPA sem assinatura)

# App iOS da demonstracao (dados de exemplo, sem backend) para instalar no iPhone pelo
# Sideloadly, que assina com o Apple ID na hora da instalacao. Roda em push para
# branches demo/**, na mao (workflow_dispatch, quando o arquivo estiver na main) e nos
# PRs que mexem no projeto iOS.
on:
  workflow_dispatch:
  push:
    branches: ['demo/**']
  # PR que mexe no projeto iOS compila aqui: o Swift nao tem como ser conferido no Linux.
  pull_request:
    paths:
      - 'frontend/ios/**'
      - '.github/workflows/ios-demo.yml'

permissions:
  contents: read

jobs:
  ipa:
    name: Gerar Piggu-demo.ipa
    runs-on: macos-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build:demo
      - run: npx cap sync ios

      - name: Compilar para iPhone, sem assinatura
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Empacotar o IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry Piggu-demo.ipa Payload
          ls -lh Piggu-demo.ipa

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Piggu-demo-ipa
          path: frontend/Piggu-demo.ipa
          retention-days: 30
