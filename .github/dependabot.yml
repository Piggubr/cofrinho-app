# Atualizacoes de dependencia toda semana, em PRs pequenos e agrupados.
# Correcao de seguranca chega a qualquer hora (Dependabot alerts), fora deste agendamento.
# Os PRs vao para a develop: a main so aceita PR da develop ou de hotfix/... (docs/branches.md).
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      spring:
        patterns: ["org.springframework*"]
    # Boot 4.1 so quando o Spring Cloud dele sair do milestone.
    ignore:
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /backend
    target-branch: develop
    schedule:
      interval: monthly
