<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Piggu</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fcf8f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161015" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Piggu, o cofrinho dos fofos." />
    <link rel="icon" href="favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png?v=2" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Piggu" />
  </head>
  <body>
    <!-- Abertura enquanto o app baixa (estilo em styles.scss, .abertura). O Angular troca
         pelo mesmo desenho no app.ts, que fica ate a primeira tela abrir. Sem script: o
         aviso de conexao lenta aparece por atraso de animacao. -->
    <app-root>
      <div class="abertura" role="status">
        <img class="abertura-icone" src="icons/icon-192.png" alt="" width="88" height="88" />
        <p class="abertura-texto">Abrindo o Piggu…</p>
        <p class="abertura-lenta">Sua conexão parece lenta. Já já abre.</p>
      </div>
    </app-root>
  </body>
</html>
