<div class="cabecalho-rapido">
  <h2 i18n id="titulo-lancamento-rapido">Lançar</h2>
  <div class="alternador" role="tablist" aria-label="Tipo de lançamento" i18n-aria-label>
    <button
      i18n
      type="button"
      role="tab"
      [attr.aria-selected]="tipo() === 'gasto'"
      [class.ativo]="tipo() === 'gasto'"
      (click)="trocarTipo('gasto')"
    >
      Gasto
    </button>
    <button
      i18n
      type="button"
      role="tab"
      [attr.aria-selected]="tipo() === 'receita'"
      [class.ativo]="tipo() === 'receita'"
      (click)="trocarTipo('receita')"
    >
      Receita
    </button>
  </div>
  <button type="button" class="fechar" aria-label="Fechar" i18n-aria-label (click)="fechar.emit()">
    <app-icone nome="fechar" [tamanho]="20" />
  </button>
</div>

@if (tipo() === 'gasto') {
  <app-formulario-de-gasto prefixo="rapido-" [foto]="foto()" (lancado)="concluido($event)" />
} @else {
  <app-formulario-de-receita prefixo="rapido-" (lancado)="concluido($event)" />
}
