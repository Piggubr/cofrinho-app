<h1 i18n>Fotos do mês</h1>

@if (erro()) {
  <p class="aviso erro" role="alert">{{ erro() }}</p>
}

<section class="cartao">
  <div class="cartao-titulo">
    <h2>{{ rotuloDoMes() }}</h2>
    <div class="navegacao-de-mes">
      <button type="button" class="botao contorno pequeno" (click)="trocarMes(-1)">‹</button>
      <button type="button" class="botao contorno pequeno" (click)="trocarMes(1)">›</button>
    </div>
  </div>

  @if (auth.ehPremium()) {
    <label i18n class="botao secundario arquivo">
      @if (enviando()) {Enviando...} @else {Adicionar foto}
      <input
        type="file"
        accept="image/*"
        (change)="enviar($event)"
        [disabled]="enviando()"
        hidden
      />
    </label>
  } @else {
    <a i18n routerLink="/plano" class="botao contorno">Adicionar fotos ⭐ Premium</a>
  }
</section>

@if (carregando()) {
  <p i18n class="carregando">Carregando...</p>
} @else if (fotos().length) {
  <div class="grade">
    @for (foto of fotos(); track foto.id) {
      <figure class="cartao foto-do-feed">
        <img [src]="urlDaFoto(foto)" [alt]="foto.legenda || 'Foto do mês'" loading="lazy" />
        <figcaption>
          <input i18n-placeholder i18n-aria-label
            type="text"
            [value]="foto.legenda"
            (change)="legendar(foto, $any($event.target).value)"
            placeholder="Escreva uma legenda"
            aria-label="Legenda da foto"
          />
          <button i18n type="button" class="botao perigo" (click)="excluir(foto)">Apagar</button>
        </figcaption>
      </figure>
    }
  </div>
} @else {
  <p i18n class="vazio">Nenhuma foto neste mês ainda.</p>
}
