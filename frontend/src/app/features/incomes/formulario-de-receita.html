@if (erro()) {
  <p class="aviso erro" role="alert">{{ erro() }}</p>
}
<div class="linha-de-campos">
  <div class="campo">
    <label i18n [for]="prefixo() + 'valor-receita'">Valor</label>
    <input
      [id]="prefixo() + 'valor-receita'"
      type="number"
      inputmode="decimal"
      min="0.01"
      step="0.01"
      [ngModel]="valor()"
      (ngModelChange)="valor.set($event)"
    />
  </div>
  <div class="campo">
    <label i18n [for]="prefixo() + 'descricao-receita'">Descrição</label>
    <input
      [id]="prefixo() + 'descricao-receita'"
      maxlength="200"
      [ngModel]="descricao()"
      (ngModelChange)="descricao.set($event)"
      placeholder="Salário de outubro"
      i18n-placeholder
    />
  </div>
  <div class="campo">
    <label i18n [for]="prefixo() + 'categoria-receita'">Categoria</label>
    <select
      [id]="prefixo() + 'categoria-receita'"
      [ngModel]="categoria()"
      (ngModelChange)="categoria.set($event)"
    >
      @for (opcao of categorias(); track opcao) {
        <option [value]="opcao">{{ opcao }}</option>
      }
    </select>
  </div>
  <div class="campo">
    <label i18n [for]="prefixo() + 'data-receita'">Data</label>
    <input
      [id]="prefixo() + 'data-receita'"
      type="date"
      [ngModel]="data()"
      (ngModelChange)="data.set($event)"
    />
  </div>
</div>
<label class="repetir">
  <input type="checkbox" [checked]="repetir()" (change)="repetir.set($any($event.target).checked)" />
  <span i18n>Entra sozinha todo mês no dia {{ diaDaReceita() }} (salário, aluguel que você recebe)</span>
</label>
<div class="acoes">
  <button i18n type="button" class="botao" (click)="lancar()" [disabled]="salvando()">
    Lançar receita
  </button>
</div>
