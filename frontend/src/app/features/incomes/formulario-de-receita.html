@if (erro()) {
  <p class="aviso erro" role="alert">{{ erro() }}</p>
}
<div class="linha-de-campos">
  <div class="campo">
    <label i18n [for]="prefixo() + 'valor-receita'">Valor</label>
    <input
      appValor
      [id]="prefixo() + 'valor-receita'"
      [ngModel]="valor()"
      (ngModelChange)="valor.set($event)"
    />
  </div>
  <div class="campo">
    <label i18n [for]="prefixo() + 'descricao-receita'">Descrição</label>
    <input
      [id]="prefixo() + 'descricao-receita'"
      maxlength="200"
      [ngModel]="descricao()"
      (ngModelChange)="descricao.set($event)"
      placeholder="Salário de outubro"
      i18n-placeholder
    />
  </div>
  <div class="campo">
    <label i18n [for]="prefixo() + 'categoria-receita'">Categoria</label>
    <select
      [id]="prefixo() + 'categoria-receita'"
      [ngModel]="categoria()"
      (ngModelChange)="categoria.set($event)"
    >
      @for (opcao of categorias(); track opcao) {
        <option [value]="opcao">{{ opcao }}</option>
      }
    </select>
  </div>
  <div class="campo">
    <label i18n [for]="prefixo() + 'data-receita'">Data</label>
    <input
      [id]="prefixo() + 'data-receita'"
      type="date"
      [ngModel]="data()"
      (ngModelChange)="data.set($event)"
    />
  </div>
</div>
<label class="repetir">
  <input
    type="checkbox"
    [checked]="repetir()"
    (change)="repetir.set($any($event.target).checked)"
  />
  <span i18n
    >Entra sozinha todo mês no dia {{ diaDaReceita() }} (salário, aluguel que você recebe)</span
  >
</label>
@if (repetir()) {
  <label class="repetir">
    <input
      type="checkbox"
      [checked]="emDuasParcelas()"
      (change)="emDuasParcelas.set($any($event.target).checked)"
    />
    <span i18n>Em duas parcelas (salário com adiantamento): o valor acima é a 1ª</span>
  </label>
  @if (emDuasParcelas()) {
    <div class="linha-de-campos repetir">
      <div class="campo">
        <label i18n [for]="prefixo() + 'segundo-dia'">Dia da 2ª parcela</label>
        <input
          [id]="prefixo() + 'segundo-dia'"
          type="number"
          min="1"
          max="31"
          [ngModel]="segundoDia()"
          (ngModelChange)="segundoDia.set($event)"
        />
      </div>
      <div class="campo">
        <label i18n [for]="prefixo() + 'segundo-valor'">Valor da 2ª parcela</label>
        <input
          appValor
          [id]="prefixo() + 'segundo-valor'"
          [ngModel]="segundoValor()"
          (ngModelChange)="segundoValor.set($event)"
        />
      </div>
    </div>
  }
}
@if (pessoas.temCompanhia()) {
  <label class="repetir">
    <input
      type="checkbox"
      [checked]="compartilhadaEfetiva()"
      (change)="compartilhada.set($any($event.target).checked)"
    />
    <span i18n>Compartilhada: aparece para quem mora com você</span>
  </label>
}
<div class="acoes">
  <button i18n type="button" class="botao" (click)="lancar()" [disabled]="salvando()">
    Lançar receita
  </button>
</div>
